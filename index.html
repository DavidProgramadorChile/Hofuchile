<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HŌFU - Menu Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Transiciones fluidas estilo app nativa */
        .native-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Animación de pulso para el contador del carrito */
        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .badge-bounce {
            animation: badgePop 0.3s ease-in-out;
        }
        /* Animación suave para la sugerencia dinámica */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.9; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }
        .sugges-pulse {
            animation: subtlePulse 3s ease-in-out infinite;
        }
        /* Ocultar barras de scroll generales */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-amber-950 text-white selection:bg-orange-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Estructura completa de categorías y productos
        const categoriesData = {
          gohan: {
            name: 'GOHAN',
            items: [
              {
                id: 'salmon',
                title: 'Gohan Salmón',
                description: 'Base de Arroz • Salmón • Palta • Queso Crema • Cebollín',
                price: '$6.500',
                rawPrice: 6500,
                bgGradient: 'from-amber-700 via-orange-600 to-stone-950',
                isLight: false,
                image: 'img/gohansalmon.png',
              },
              {
                id: 'camaron',
                title: 'Gohan Camarón',
                description: 'Base de Arroz • Camarón Apanado • Palta • Queso Crema • Cebollín',
                price: '$6.000',
                rawPrice: 6000,
                bgGradient: 'from-rose-800 via-orange-700 to-stone-950',
                isLight: false,
                image: 'img/gohancamaron.png',
              },
              {
                id: 'pollo',
                title: 'Gohan Pollo',
                description: 'Base de Arroz • Pollo Apanado • Palta • Queso Crema • Cebollín',
                price: '$5.500',
                rawPrice: 5500,
                bgGradient: 'from-amber-400 via-yellow-400 to-orange-400',
                isLight: true,
                image: 'img/gohanpollo.png',
              },
            ]
          },
          rolls: {
            name: 'SPECIAL ROLLS',
            items: [
              {
                id: 'tempuraroll',
                title: 'Tempura Roll',
                description: 'Camarón Apanado • Palta • Queso Crema',
                price: '$4.800',
                rawPrice: 4800,
                bgGradient: 'from-amber-600 via-amber-700 to-stone-950',
                isLight: false,
                image: 'img/tempuraroll.png',
              },
              {
                id: 'eskimalroll',
                title: 'Eskimal Roll',
                description: 'Camarón • Palta • Queso Crema',
                price: '$4.600',
                rawPrice: 4600,
                bgGradient: 'from-teal-600 via-cyan-800 to-stone-950',
                isLight: false,
                image: 'img/eskimalroll.png',
              }
            ]
          },
          bebidas: {
            name: 'BEBIDAS',
            items: [
              {
                id: 'bebidal15',
                title: 'Bebidas de Lt 1.5',
                description: 'Bebida formato familiar 1.5 Litros bien fría para acompañar',
                price: '$2.500',
                rawPrice: 2500,
                bgGradient: 'from-red-800 via-stone-900 to-stone-950',
                isLight: false,
                image: 'img/bebida1.5.png',
                hasFlavorSelector: true
              },
              {
                id: 'bebidasa350',
                title: 'Bebibas 350 cc',
                description: 'Bebida en lata individual 350 cc refrescante',
                price: '$1.500',
                rawPrice: 1500,
                bgGradient: 'from-blue-800 via-indigo-900 to-stone-950',
                isLight: false,
                image: 'img/bebidaslata.png',
                hasFlavorSelector: true
              }
            ]
          },
          extras: {
            name: 'EXTRAS',
            items: [
              {
                id: 'soyaextra',
                title: 'Salsa Soya Extra',
                description: 'Porción adicional de salsa de soya tradicional',
                price: '$500',
                rawPrice: 500,
                bgGradient: 'from-amber-900 via-stone-900 to-stone-950',
                isLight: false,
                image: 'img/soyaextra.png',
              },
              {
                id: 'unaguiextra',
                title: 'Salsa Unagui Extra',
                description: 'Salsa dulce de anguila caramelizada adicional',
                price: '$800',
                rawPrice: 800,
                bgGradient: 'from-amber-800 via-orange-950 to-stone-950',
                isLight: false,
                image: 'img/unaguiextra.png',
              },
              {
                id: 'porcionpalta',
                title: 'Porción de Palta',
                description: 'Extra de palta fresca en láminas',
                price: '$1.200',
                rawPrice: 1200,
                bgGradient: 'from-emerald-700 via-green-900 to-stone-950',
                isLight: false,
                image: 'img/porcionpalta.png',
              },
              {
                id: 'quesocremaextra',
                title: 'Queso Crema Extra',
                description: 'Porción adicional de queso crema Philadelphia',
                price: '$1.000',
                rawPrice: 1000,
                bgGradient: 'from-yellow-700 via-amber-900 to-stone-950',
                isLight: false,
                image: 'img/quesocremaextra.png',
              }
            ]
          }
        };

        const SABORES_BEBIDAS = ["Coca-Cola", "Coca-Cola Zero", "Fanta", "Sprite"];

        const COMUNAS_SANTIAGO = [
          "Cerrillos", "Cerro Navia", "Conchalí", "El Bosque", "Estación Central", 
          "Huechuraba", "Independencia", "La Cisterna", "La Florida", "La Granja", 
          "La Pintana", "La Reina", "Las Condes", "Lo Barnechea", "Lo Espejo", 
          "Lo Prado", "Macul", "Maipú", "Ñuñoa", "Pedro Aguirre Cerda", 
          "Peñalolén", "Providencia", "Pudahuel", "Quilicura", "Quinta Normal", 
          "Recoleta", "Renca", "San Joaquín", "San Miguel", "San Ramón", 
          "Santiago", "Vitacura"
        ];

        const METODOS_PAGO = ["Transferencia", "Efectivo", "Tarjeta"];

        function HofuLanding() {
          const [activeCategory, setActiveCategory] = useState('gohan');
          const [selectedItem, setSelectedItem] = useState(categoriesData.gohan.items[0]);
          const [selectedFlavor, setSelectedFlavor] = useState('Coca-Cola');
          const [animating, setAnimating] = useState(false);
          const [quantity, setQuantity] = useState(1);

          // Estados para interactividad (Buscador completo PC, Carrito con LocalStorage y Modal Checkout)
          const [searchQuery, setSearchQuery] = useState('');
          const [cartOpen, setCartOpen] = useState(false);
          
          // Inicializar el carrito desde LocalStorage de manera segura
          const [cart, setCart] = useState(() => {
            try {
              const savedCart = localStorage.getItem('hofu_cart');
              return savedCart ? JSON.parse(savedCart) : [];
            } catch (e) {
              return [];
            }
          });

          const [orderSuccess, setOrderSuccess] = useState(false);
          const [badgePulsing, setBadgePulsing] = useState(false);
          
          // Estado para animación de succión (Fly-to-Cart)
          const [flyingItem, setFlyingItem] = useState(null);

          const [formData, setFormData] = useState({ 
            firstName: '', 
            street: '', 
            number: '',
            comuna: 'Santiago', 
            phone: '',
            paymentMethod: 'Transferencia'
          });

          // Estado para selector de comuna personalizado
          const [comunaDropdownOpen, setComunaDropdownOpen] = useState(false);
          const [comunaSearch, setComunaSearch] = useState('');

          const comunaRef = useRef(null);
          const cartButtonRef = useRef(null);
          const productImgRef = useRef(null);

          // Guardar en LocalStorage cada vez que el carrito cambie
          useEffect(() => {
            try {
              localStorage.setItem('hofu_cart', JSON.stringify(cart));
            } catch (e) {
              console.error("No se pudo guardar en localStorage", e);
            }
          }, [cart]);

          // Manejar clics fuera del dropdown de comuna para cerrarlo
          useEffect(() => {
            function handleClickOutside(event) {
              if (comunaRef.current && !comunaRef.current.contains(event.target)) {
                setComunaDropdownOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          // Cambiar de categoría con transición fluida
          const handleCategoryChange = (categoryKey) => {
            if (categoryKey === activeCategory) return;
            setAnimating(true);
            setActiveCategory(categoryKey);
            const firstItem = categoriesData[categoryKey].items[0];
            setSelectedItem(firstItem);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setTimeout(() => setAnimating(false), 350);
          };

          // Cambiar de producto con transición fluida tipo app nativa
          const handleItemChange = (item) => {
            if (item.id === selectedItem.id) return;
            setAnimating(true);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setTimeout(() => setAnimating(false), 350);
          };

          // Control de cantidad
          const decreaseQty = () => setQuantity(prev => (prev > 1 ? prev - 1 : 1));
          const increaseQty = () => setQuantity(prev => prev + 1);

          // Añadir producto actual al carrito con Animación de Succión (Fly-to-Cart)
          const addToCart = () => {
            if (productImgRef.current && cartButtonRef.current) {
              const startRect = productImgRef.current.getBoundingClientRect();
              const endRect = cartButtonRef.current.getBoundingClientRect();

              setFlyingItem({
                image: selectedItem.image,
                startX: startRect.left + startRect.width / 2 - 25,
                startY: startRect.top + startRect.height / 2 - 25,
                endX: endRect.left + endRect.width / 2 - 25,
                endY: endRect.top + endRect.height / 2 - 25
              });

              setTimeout(() => {
                setFlyingItem(null);
                setBadgePulsing(true);
                setTimeout(() => setBadgePulsing(false), 300);
              }, 600);
            }

            const flavorSuffix = selectedItem.hasFlavorSelector ? ` (${selectedFlavor})` : '';
            const cartItemId = `${selectedItem.id}${flavorSuffix}`;
            const cartItemTitle = `${selectedItem.title}${flavorSuffix}`;

            setCart(prevCart => {
              const existingIndex = prevCart.findIndex(item => item.cartItemId === cartItemId);
              if (existingIndex > -1) {
                const updated = [...prevCart];
                updated[existingIndex].quantity += quantity;
                return updated;
              } else {
                return [...prevCart, { 
                  ...selectedItem, 
                  cartItemId, 
                  displayTitle: cartItemTitle, 
                  quantity 
                }];
              }
            });
            setQuantity(1);
          };

          // Modificar cantidad en carrito
          const updateCartItemQty = (cartItemId, delta) => {
            setCart(prevCart => {
              return prevCart.map(item => {
                if (item.cartItemId === cartItemId) {
                  const newQty = item.quantity + delta;
                  return newQty > 0 ? { ...item, quantity: newQty } : null;
                }
                return item;
              }).filter(Boolean);
            });
          };

          // Eliminar un producto específico del carrito
          const removeCartItem = (cartItemId) => {
            setCart(prevCart => prevCart.filter(item => item.cartItemId !== cartItemId));
          };

          // Vaciar todo el carrito
          const clearCart = () => {
            setCart([]);
          };

          // Filtrar productos para el buscador principal entre todas las categorías
          const allProducts = Object.values(categoriesData).flatMap(cat => cat.items);
          const filteredProducts = searchQuery.trim() === '' ? [] : allProducts.filter(p => 
            p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.description.toLowerCase().includes(searchQuery.toLowerCase())
          );

          const selectSearchedItem = (item) => {
            const targetCat = Object.keys(categoriesData).find(catKey => 
              categoriesData[catKey].items.some(i => i.id === item.id)
            ) || 'gohan';
            
            setAnimating(true);
            setActiveCategory(targetCat);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setSearchQuery('');
            setTimeout(() => setAnimating(false), 350);
          };

          // Procesar formulario y enviar a WhatsApp
          const handleCheckoutSubmit = (e) => {
            e.preventDefault();
            if (!formData.firstName || !formData.street || !formData.number || !formData.phone) return;

            const totalAmount = cart.reduce((acc, item) => acc + (item.rawPrice * item.quantity), 0);
            
            let message = `*¡Hola HŌFU! Quisiera realizar el siguiente pedido:*\n\n`;
            message += `*📋 DETALLE DE LA ORDEN:*\n`;
            cart.forEach((item, idx) => {
              message += `${idx + 1}. ${item.displayTitle} x${item.quantity} - $${(item.rawPrice * item.quantity).toLocaleString('es-CL')}\n`;
            });
            message += `\n*💰 Total a pagar:* $${totalAmount.toLocaleString('es-CL')}\n`;
            message += `*💳 Método de pago:* ${formData.paymentMethod}\n\n`;
            
            message += `*📍 DATOS DE ENTREGA:*\n`;
            message += `• *Nombre:* ${formData.firstName}\n`;
            message += `• *Dirección:* ${formData.street} #${formData.number}\n`;
            message += `• *Comuna:* ${formData.comuna}\n`;
            message += `• *Teléfono:* ${formData.phone}\n`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/56920468336?text=${encodedMessage}`;

            setOrderSuccess(true);
            
            setTimeout(() => {
              window.open(whatsappUrl, '_blank');
              setOrderSuccess(false);
              setCart([]);
              setCartOpen(false);
              setFormData({ firstName: '', street: '', number: '', comuna: 'Santiago', phone: '', paymentMethod: 'Transferencia' });
            }, 2000);
          };

          const isLight = selectedItem.isLight;
          const filteredComunas = COMUNAS_SANTIAGO.filter(c => c.toLowerCase().includes(comunaSearch.toLowerCase()));
          const totalCartItemsCount = cart.reduce((acc, item) => acc + item.quantity, 0);

          return (
            <div className={`min-h-screen w-full bg-gradient-to-br ${selectedItem.bgGradient} ${isLight ? 'text-stone-950' : 'text-white'} native-transition flex flex-col overflow-x-hidden select-none relative pb-12`}>
              
              {/* Elemento Volador para la Animación de Succión (Fly-to-Cart) */}
              {flyingItem && (
                <div 
                  style={{
                    position: 'fixed',
                    left: `${flyingItem.startX}px`,
                    top: `${flyingItem.startY}px`,
                    zIndex: 9999,
                    pointerEvents: 'none',
                    animation: 'flyToCart 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards'
                  }}
                >
                  <img src={flyingItem.image} alt="Flying item" className="w-14 h-14 object-contain drop-shadow-2xl rounded-full bg-black/40 p-1 border border-white/30" />
                </div>
              )}

              <style>{`
                @keyframes flyToCart {
                  0% {
                    transform: translate(0, 0) scale(1) rotate(0deg);
                    opacity: 1;
                  }
                  100% {
                    transform: translate(${flyingItem ? flyingItem.endX - flyingItem.startX : 0}px, ${flyingItem ? flyingItem.endY - flyingItem.startY : 0}px) scale(0.15) rotate(360deg);
                    opacity: 0.2;
                  }
                }
              `}</style>

              {/* 1. Navbar Principal con Buscador Completo a la Derecha y Categorías Centradas */}
              <header className="w-full px-6 md:px-12 py-5 flex items-center justify-between z-30 max-w-7xl mx-auto relative">
                
                {/* Logo a la izquierda */}
                <div className="flex items-center cursor-pointer">
                  <span className={`font-black tracking-[0.3em] text-2xl md:text-3xl uppercase drop-shadow-sm ${isLight ? 'text-stone-950' : 'text-white'}`}>
                    HŌFU
                  </span>
                </div>

                {/* Categorías bien centradas en Desktop */}
                <nav className={`hidden md:flex items-center gap-1 ${isLight ? 'bg-black/10 border-stone-900/20 text-stone-900' : 'bg-black/20 border-white/20 text-white'} backdrop-blur-md px-4 py-1.5 rounded-full border text-xs tracking-wider font-medium shadow-md`}>
                  {Object.keys(categoriesData).map((catKey) => {
                    const isActive = activeCategory === catKey;
                    return (
                      <button
                        key={catKey}
                        onClick={() => handleCategoryChange(catKey)}
                        className={`px-4 py-2 rounded-full transition-all duration-300 cursor-pointer tracking-wider ${
                          isActive 
                            ? `${isLight ? 'bg-stone-950 text-white' : 'bg-white/25 text-white'} shadow-sm font-bold scale-105` 
                            : `${isLight ? 'hover:text-stone-950 text-stone-900/80' : 'hover:text-white text-white/80'}`
                        }`}
                      >
                        {categoriesData[catKey].name}
                      </button>
                    );
                  })}
                </nav>

                {/* Controles de la derecha: Barra de búsqueda completa + Botón Carrito en Negro Sólido */}
                <div className="flex items-center gap-3">
                  
                  {/* Barra de búsqueda completa integrada (PC) */}
                  <div className="hidden md:flex items-center relative">
                    <div className={`flex items-center gap-2 px-3.5 py-2 rounded-full border ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-black/25 text-white border-white/20'} shadow-lg transition-all duration-300 w-56 lg:w-64`}>
                      <i className="fa-solid fa-search text-xs opacity-50 shrink-0"></i>
                      <input 
                        type="text" 
                        placeholder="Buscar plato, bebida..." 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="bg-transparent w-full text-xs outline-none placeholder-current placeholder-opacity-50 font-medium"
                      />
                      {searchQuery.trim() !== '' && (
                        <button 
                          onClick={() => setSearchQuery('')}
                          className="w-5 h-5 rounded-full flex items-center justify-center opacity-60 hover:opacity-100 transition cursor-pointer text-xs"
                        >
                          <i className="fa-solid fa-xmark text-xs"></i>
                        </button>
                      )}
                    </div>

                    {/* Resultados del buscador flotantes */}
                    {searchQuery.trim() !== '' && (
                      <div className={`absolute right-0 top-12 w-72 sm:w-80 ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-stone-900 text-white border-white/10'} p-3 rounded-2xl shadow-2xl border z-40`}>
                        <div className="max-h-48 overflow-y-auto space-y-1">
                          {filteredProducts.length > 0 ? (
                            filteredProducts.map(prod => (
                              <div 
                                key={prod.id}
                                onClick={() => selectSearchedItem(prod)}
                                className={`flex items-center justify-between p-2 rounded-xl ${isLight ? 'hover:bg-stone-100' : 'hover:bg-white/10'} cursor-pointer transition text-xs`}
                              >
                                <div className="flex items-center gap-2">
                                  <img src={prod.image} alt={prod.title} className="w-8 h-8 object-cover rounded-lg" />
                                  <span className="font-semibold">{prod.title}</span>
                                </div>
                                <span className="font-bold text-orange-400">{prod.price}</span>
                              </div>
                            ))
                          ) : (
                            <div className="p-3 text-center text-xs opacity-50">No se encontraron resultados</div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Botón Carrito / Bolsa en Color Negro Sólido */}
                  <button 
                    ref={cartButtonRef}
                    onClick={() => setCartOpen(true)}
                    className="w-10 h-10 rounded-full bg-stone-950 text-white hover:bg-black border border-white/20 backdrop-blur-md flex items-center justify-center transition relative cursor-pointer shadow-md"
                  >
                    <i className="fa-solid fa-bag-shopping text-xs"></i>
                    {cart.reduce((sum, item) => sum + item.quantity, 0) > 0 && (
                      <span className={`absolute -top-1 -right-1 w-4 h-4 bg-orange-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold ${badgePulsing ? 'badge-bounce' : ''}`}>
                        {cart.reduce((sum, item) => sum + item.quantity, 0)}
                      </span>
                    )}
                  </button>
                </div>
              </header>

              {/* Menú de categorías móvil (INTACTO) */}
              <div className={`flex md:hidden overflow-x-auto px-4 py-2 gap-2 scrollbar-none z-20 border-b ${isLight ? 'border-stone-900/10 bg-black/5 text-stone-900' : 'border-white/10 bg-black/15 text-white'} backdrop-blur-md justify-start`}>
                {Object.keys(categoriesData).map((catKey) => {
                  const isActive = activeCategory === catKey;
                  return (
                    <button
                      key={catKey}
                      onClick={() => handleCategoryChange(catKey)}
                      className={`px-4 py-1.5 rounded-full text-[10px] tracking-wider whitespace-nowrap transition-all duration-300 cursor-pointer ${
                        isActive 
                          ? `${isLight ? 'bg-stone-950 text-white font-bold' : 'bg-white/30 text-white font-bold'} scale-105` 
                          : `${isLight ? 'text-stone-900/80' : 'text-white/80'}`
                      }`}
                    >
                      {categoriesData[catKey].name}
                    </button>
                  );
                })}
              </div>

              {/* 2. Main Hero Section */}
              <main className="flex-1 flex items-center justify-center px-4 md:px-8 py-8 z-10 w-full max-w-7xl mx-auto">
                <div className="w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  
                  {/* Columna Izquierda (PC) */}
                  <div className="lg:col-span-4 hidden lg:flex flex-col justify-center space-y-4 order-1 text-left">
                    <div className={`space-y-4 transition-all duration-300 ease-out ${animating ? 'opacity-0 -translate-x-6 scale-95' : 'opacity-100 translate-x-0 scale-100'}`}>
                      <h1 className="text-4xl lg:text-5xl font-extrabold tracking-tight leading-tight drop-shadow-sm">
                        <span>{selectedItem.title}</span>
                      </h1>
                      
                      <p className={`text-base leading-relaxed max-w-sm font-medium ${isLight ? 'text-stone-900/90' : 'text-white/95'} drop-shadow`}>
                        {selectedItem.description}
                      </p>

                      {selectedItem.hasFlavorSelector && (
                        <div className="space-y-2 pt-1">
                          <label className="text-xs font-bold uppercase tracking-wider opacity-90 block">Elige tu sabor:</label>
                          <div className="flex flex-wrap gap-2">
                            {SABORES_BEBIDAS.map((flavor) => (
                              <button
                                key={flavor}
                                onClick={() => setSelectedFlavor(flavor)}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition-all cursor-pointer ${
                                  selectedFlavor === flavor
                                    ? 'bg-orange-500 border-orange-400 text-white shadow-md scale-105'
                                    : `${isLight ? 'bg-black/5 border-stone-900/20 text-stone-900 hover:bg-black/10' : 'bg-black/30 border-white/20 text-white/90 hover:bg-black/50'}`
                                }`}
                              >
                                {flavor}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="pt-2 flex items-center gap-4">
                        <div className={`flex items-center rounded-full border px-3.5 py-2 ${isLight ? 'bg-black/5 border-stone-900/20' : 'bg-black/30 border-white/25'} backdrop-blur-md shadow-md`}>
                          <button onClick={decreaseQty} className="w-7 h-7 flex items-center justify-center font-bold text-base hover:opacity-75 transition cursor-pointer">
                            <i className="fa-solid fa-minus text-xs"></i>
                          </button>
                          <span className="w-8 text-center font-bold text-sm">{quantity}</span>
                          <button onClick={increaseQty} className="w-7 h-7 flex items-center justify-center font-bold text-base hover:opacity-75 transition cursor-pointer">
                            <i className="fa-solid fa-plus text-xs"></i>
                          </button>
                        </div>

                        <button 
                          onClick={addToCart}
                          className={`font-semibold px-6 py-3 rounded-full flex items-center gap-3 transition shadow-xl text-xs group cursor-pointer border ${isLight ? 'bg-stone-950 text-white border-black hover:bg-stone-900' : 'bg-stone-950 text-white border-white/20 hover:bg-black'}`}
                        >
                          Añadir al carrito 
                          <span className="w-5 h-5 bg-white text-stone-950 rounded-full flex items-center justify-center text-xs font-bold group-hover:translate-x-1 transition">
                            <i className="fa-solid fa-plus text-[10px]"></i>
                          </span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Versión Móvil: Título superior (INTACTO) */}
                  <div className={`flex lg:hidden flex-col items-center text-center order-1 pt-2 pb-0 transition-all duration-300 ease-out ${animating ? 'opacity-0 scale-90' : 'opacity-100 scale-100'}`}>
                    <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight whitespace-nowrap drop-shadow-sm">
                      <span>{selectedItem.title}</span>
                    </h1>
                  </div>

                  {/* Columna Central (PC) */}
                  <div className="lg:col-span-5 relative flex flex-col items-center justify-center order-2">
                    <div className="relative w-full h-[240px] sm:h-[300px] lg:h-[400px] flex items-center justify-center my-4">
                      <div className={`absolute w-56 h-56 sm:w-72 sm:h-72 ${isLight ? 'bg-white/60' : 'bg-white/20'} rounded-full blur-3xl pointer-events-none transition-all duration-500`}></div>
                      
                      <img 
                        ref={productImgRef}
                        src={selectedItem.image} 
                        alt={selectedItem.title}
                        className={`max-h-full max-w-full object-contain drop-shadow-[0_30px_30px_rgba(0,0,0,0.5)] transition-all duration-400 ease-out ${
                          animating ? 'opacity-0 scale-75 rotate-3 translate-y-6' : 'opacity-100 scale-100 rotate-0 translate-y-0'
                        }`}
                        onError={(e)=>{
                          e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800";
                        }}
                      />
                    </div>

                    {/* Controles en Móvil (INTACTOS) */}
                    <div className={`flex lg:hidden flex-col items-center text-center space-y-3 w-full px-3 mt-1 pb-4 transition-all duration-300 ease-out ${animating ? 'opacity-0 translate-y-4' : 'opacity-100 translate-y-0'}`}>
                      <p className={`text-xs sm:text-sm font-medium leading-relaxed max-w-xs ${isLight ? 'text-stone-900/90' : 'text-white/95'} drop-shadow`}>
                        {selectedItem.description}
                      </p>

                      {selectedItem.hasFlavorSelector && (
                        <div className="space-y-1 w-full max-w-xs pt-1">
                          <label className="text-[10px] font-bold uppercase tracking-wider opacity-90 block text-center">Elige tu sabor:</label>
                          <div className="flex flex-wrap justify-center gap-1.5">
                            {SABORES_BEBIDAS.map((flavor) => (
                              <button
                                key={flavor}
                                onClick={() => setSelectedFlavor(flavor)}
                                className={`px-2.5 py-1 rounded-xl text-[10px] font-semibold border transition-all cursor-pointer ${
                                  selectedFlavor === flavor
                                    ? 'bg-orange-500 border-orange-400 text-white shadow-md scale-105'
                                    : `${isLight ? 'bg-black/5 border-stone-900/20 text-stone-900' : 'bg-black/30 border-white/20 text-white/90'}`
                                }`}
                              >
                                {flavor}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex items-center gap-3 pt-1">
                        <div className={`flex items-center rounded-full border px-2 py-1 ${isLight ? 'bg-black/5 border-stone-900/20' : 'bg-black/30 border-white/25'} backdrop-blur-md`}>
                          <button onClick={decreaseQty} className="w-6 h-6 flex items-center justify-center font-bold text-sm">
                            <i className="fa-solid fa-minus text-[10px]"></i>
                          </button>
                          <span className="w-6 text-center font-bold text-xs">{quantity}</span>
                          <button onClick={increaseQty} className="w-6 h-6 flex items-center justify-center font-bold text-sm">
                            <i className="fa-solid fa-plus text-[10px]"></i>
                          </button>
                        </div>

                        <button 
                          onClick={addToCart}
                          className={`font-semibold px-5 py-2.5 rounded-full flex items-center gap-2 transition shadow-xl text-xs group cursor-pointer border ${isLight ? 'bg-stone-950 text-white border-black hover:bg-stone-900' : 'bg-stone-950 text-white border-white/20 hover:bg-black'}`}
                        >
                          Añadir al carrito 
                          <span className="w-5 h-5 bg-white text-stone-950 rounded-full flex items-center justify-center text-[10px] font-bold">
                            <i className="fa-solid fa-plus text-[8px]"></i>
                          </span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Columna Derecha (PC) */}
                  <div className="lg:col-span-3 flex flex-col justify-center items-center lg:items-center space-y-6 order-3 pb-8 lg:pb-0">
                    <div className={`text-center space-y-1 transition-all duration-300 ease-out ${animating ? 'opacity-0 scale-90 translate-y-2' : 'opacity-100 scale-100 translate-y-0'}`}>
                      <div className="text-4xl sm:text-5xl lg:text-5xl font-extrabold tracking-tight drop-shadow-sm">{selectedItem.price}</div>
                    </div>

                    <div className="space-y-2 w-full flex flex-col items-center">
                      <div className="flex gap-2.5 justify-center flex-wrap max-w-xs">
                        {categoriesData[activeCategory].items.map((item) => (
                          <button
                            key={item.id}
                            onClick={() => handleItemChange(item)}
                            className={`w-14 h-16 rounded-2xl overflow-hidden border-2 transition-all duration-300 relative cursor-pointer ${isLight ? 'bg-black/10' : 'bg-black/30'} shadow-md ${
                              selectedItem.id === item.id
                                ? `${isLight ? 'border-stone-950 ring-2 ring-stone-950/40' : 'border-white ring-2 ring-white/50'} scale-110 shadow-xl`
                                : `${isLight ? 'border-stone-900/30 opacity-70 hover:opacity-100' : 'border-white/30 opacity-70 hover:opacity-100'}`
                            }`}
                          >
                            <img 
                              src={item.image} 
                              alt={item.title} 
                              className="w-full h-full object-cover"
                              onError={(e)=>{
                                e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800";
                              }}
                            />
                          </button>
                        ))}
                      </div>
                    </div>

                  </div>

                </div>
              </main>

              {/* 3. Modal de Checkout (Layout Independiente: 2 Columnas Estrictas en PC / Vertical en Móvil) */}
              {cartOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                  
                  <div className="bg-gradient-to-br from-amber-700 via-orange-600 to-stone-950 rounded-3xl w-full max-w-md lg:max-w-4xl p-5 md:p-6 shadow-2xl border border-white/20 relative animate-in fade-in zoom-in duration-200 flex flex-col justify-between overflow-visible text-white">
                    
                    {/* Botón cerrar */}
                    <button 
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setCartOpen(false);
                      }}
                      className="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center transition cursor-pointer z-20 font-bold text-sm border bg-black/40 hover:bg-black/60 text-white border-white/20"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>

                    <h3 className="text-lg md:text-xl font-black mb-2 tracking-wide drop-shadow-sm pr-12 text-white">Resumen de tu Pedido</h3>

                    {orderSuccess ? (
                      <div className="py-10 text-center space-y-3 my-auto">
                        <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto text-2xl font-bold border bg-black/40 text-emerald-400 border-white/20">
                          <i className="fa-solid fa-check"></i>
                        </div>
                        <h4 className="text-lg font-black text-white">¡Redirigiendo a WhatsApp!</h4>
                        <p className="text-xs font-bold opacity-80 text-white">Se abrió tu chat con el pedido detallado. ¡Gracias por elegir HŌFU!</p>
                      </div>
                    ) : (
                      <div className="flex flex-col justify-between h-full pt-1">
                        <div className="flex items-center justify-between border-b pb-1.5 border-white/20 text-white">
                          <span className="text-xs md:text-sm uppercase tracking-wider font-black text-white">Productos en tu bolsa</span>
                          {cart.length > 0 && (
                            <button 
                              onClick={clearCart}
                              className="text-xs md:text-sm font-black transition flex items-center gap-1.5 cursor-pointer text-orange-200 hover:text-white"
                            >
                              <i className="fa-solid fa-trash-can text-xs text-black"></i> Vaciar
                            </button>
                          )}
                        </div>

                        {cart.length === 0 ? (
                          <div className="py-10 text-center text-xs md:text-sm space-y-2 font-bold text-white/80 my-auto">
                            <i className="fa-solid fa-bag-shopping text-4xl opacity-50 block mb-1"></i>
                            Tu bolsa está vacía. ¡Añade platos!
                          </div>
                        ) : (
                          /* LAYOUT INDEPENDIENTE: 1 columna en móviles, 2 columnas amplias exclusivamente en lg (PC) */
                          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto pt-2">
                            
                            {/* Columna Izquierda (PC) / Bloque Superior (Móvil) */}
                            <div className="lg:col-span-6 space-y-2.5 flex flex-col">
                              <div className="space-y-2 max-h-56 overflow-y-auto no-scrollbar pr-1">
                                {cart.map((item) => (
                                  <div key={item.cartItemId} className="flex items-center justify-between gap-2 shadow-md backdrop-blur-md p-2 rounded-xl border border-white/20 bg-black/30 text-white">
                                    <div className="flex items-center gap-2 min-w-0 flex-1">
                                      <img src={item.image} alt={item.title} className="w-8 h-8 object-cover rounded-lg shrink-0 border border-white/20" />
                                      <div className="min-w-0 flex-1">
                                        <h4 className="font-black text-xs leading-tight text-white whitespace-normal break-words">{item.displayTitle}</h4>
                                        <p className="text-xs font-black text-black">{item.price} c/u</p>
                                      </div>
                                    </div>

                                    <div className="flex items-center gap-2 shrink-0">
                                      <div className="flex items-center border border-white/20 bg-black/40 text-white rounded-lg px-1.5 py-0.5">
                                        <button onClick={() => updateCartItemQty(item.cartItemId, -1)} className="px-1 text-xs font-black cursor-pointer">
                                          <i className="fa-solid fa-minus text-[7px]"></i>
                                        </button>
                                        <span className="w-4 text-center text-xs font-black">{item.quantity}</span>
                                        <button onClick={() => updateCartItemQty(item.cartItemId, 1)} className="px-1 text-xs font-black cursor-pointer">
                                          <i className="fa-solid fa-plus text-[7px]"></i>
                                        </button>
                                      </div>
                                      <span className="font-black text-xs w-12 text-right text-black">${(item.rawPrice * item.quantity).toLocaleString('es-CL')}</span>
                                      <button 
                                        onClick={() => removeCartItem(item.cartItemId)}
                                        className="w-6 h-6 rounded-full flex items-center justify-center transition cursor-pointer text-xs shrink-0 font-bold bg-white/20 text-black hover:bg-red-500 border border-white/30"
                                        title="Eliminar"
                                      >
                                        <i className="fa-solid fa-trash-can text-[9px] text-black"></i>
                                      </button>
                                    </div>
                                  </div>
                                ))}
                              </div>

                              <div className="flex justify-between items-center pt-1.5 border-t border-white/20 text-white font-black text-sm">
                                <span>Total a pagar:</span>
                                <span className="text-base font-black text-black">
                                  ${cart.reduce((acc, item) => acc + (item.rawPrice * item.quantity), 0).toLocaleString('es-CL')}
                                </span>
                              </div>

                              {totalCartItemsCount < 3 && (
                                <div className="mt-1.5 p-2 rounded-xl bg-black/30 border border-white/20 flex items-center gap-2 sugges-pulse">
                                  <i className="fa-solid fa-wand-magic-sparkles text-orange-300 text-xs shrink-0"></i>
                                  <p className="text-[11px] font-bold text-white leading-tight">
                                    ¡Tip Hōfu! Añade una <span className="underline decoration-orange-400 text-orange-200">Bebida de 1.5L</span> o un extra.
                                  </p>
                                </div>
                              )}
                            </div>

                            {/* Columna Derecha (PC) / Bloque Inferior (Móvil) */}
                            <div className="lg:col-span-6">
                              <form onSubmit={handleCheckoutSubmit} className="space-y-2">
                                <h4 className="text-xs md:text-sm font-black uppercase tracking-wider text-white">Datos de Entrega</h4>
                                
                                <input 
                                  type="text" 
                                  placeholder="Nombre *" 
                                  required
                                  value={formData.firstName}
                                  onChange={(e) => setFormData({...formData, firstName: e.target.value})}
                                  className="w-full font-bold backdrop-blur-md border rounded-xl px-3 py-1.5 text-xs md:text-sm outline-none transition shadow-inner bg-black/40 border-white/25 text-white placeholder-white/50 focus:border-orange-400"
                                />

                                <div className="grid grid-cols-12 gap-2">
                                  <input 
                                    type="text" 
                                    placeholder="Calle / Dirección *" 
                                    required
                                    value={formData.street}
                                    onChange={(e) => setFormData({...formData, street: e.target.value})}
                                    className="col-span-8 font-bold backdrop-blur-md border rounded-xl px-3 py-1.5 text-xs md:text-sm outline-none transition shadow-inner bg-black/40 border-white/25 text-white placeholder-white/50 focus:border-orange-400"
                                  />
                                  <input 
                                    type="text" 
                                    placeholder="N° de depto/casa *" 
                                    required
                                    value={formData.number}
                                    onChange={(e) => setFormData({...formData, number: e.target.value})}
                                    className="col-span-4 font-bold backdrop-blur-md border rounded-xl px-2 py-1.5 text-xs md:text-sm outline-none transition shadow-inner bg-black/40 border-white/25 text-white placeholder-white/50 focus:border-orange-400"
                                  />
                                </div>

                                <div className="relative" ref={comunaRef}>
                                  <div 
                                    onClick={() => setComunaDropdownOpen(!comunaDropdownOpen)}
                                    className="w-full font-bold backdrop-blur-md border rounded-xl px-3 py-1.5 text-xs md:text-sm flex items-center justify-between cursor-pointer transition select-none shadow-inner bg-black/40 border-white/25 text-white"
                                  >
                                    <span className="truncate">{formData.comuna}</span>
                                    <i className="fa-solid fa-chevron-down text-[10px] opacity-70"></i>
                                  </div>

                                  {comunaDropdownOpen && (
                                    <div className="absolute left-0 right-0 top-full mt-1 bg-stone-900 text-white border-white/20 shadow-2xl rounded-2xl border z-50 p-2">
                                      <div className="flex items-center gap-1.5 bg-black/60 border-white/15 text-white px-2.5 py-1 rounded-xl border mb-1.5">
                                        <i className="fa-solid fa-search text-xs text-white opacity-70"></i>
                                        <input 
                                          type="text" 
                                          placeholder="Buscar comuna..."
                                          value={comunaSearch}
                                          onChange={(e) => setComunaSearch(e.target.value)}
                                          autoFocus
                                          className="bg-transparent w-full text-xs outline-none placeholder-white/50 font-bold text-white"
                                        />
                                      </div>
                                      <div className="max-h-36 overflow-y-auto no-scrollbar space-y-0.5 pr-0.5">
                                        {filteredComunas.length > 0 ? (
                                          filteredComunas.map((comuna) => (
                                            <div 
                                              key={comuna}
                                              onClick={() => {
                                                setFormData({...formData, comuna});
                                                setComunaDropdownOpen(false);
                                                setComunaSearch('');
                                              }}
                                              className={`px-2.5 py-1.5 rounded-xl text-xs cursor-pointer transition font-bold ${
                                                formData.comuna === comuna 
                                                  ? 'bg-orange-500 text-white font-black' 
                                                  : 'hover:bg-white/10 text-white'
                                              }`}
                                            >
                                              {comuna}
                                            </div>
                                          ))
                                        ) : (
                                          <div className="p-2 text-center text-xs text-white/60 font-bold">Sin resultados</div>
                                        )}
                                      </div>
                                    </div>
                                  )}
                                </div>

                                <input 
                                  type="tel" 
                                  placeholder="WhatsApp (+56 9...) *" 
                                  required
                                  value={formData.phone}
                                  onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                  className="w-full font-bold backdrop-blur-md border rounded-xl px-3 py-1.5 text-xs md:text-sm outline-none transition shadow-inner bg-black/40 border-white/25 text-white placeholder-white/50 focus:border-orange-400"
                                />

                                <div className="space-y-1">
                                  <label className="text-[10px] font-bold uppercase tracking-wider text-white/90 block">Método de Pago:</label>
                                  <div className="grid grid-cols-3 gap-1.5">
                                    {METODOS_PAGO.map((metodo) => (
                                      <button
                                        key={metodo}
                                        type="button"
                                        onClick={() => setFormData({...formData, paymentMethod: metodo})}
                                        className={`py-1.5 px-1 rounded-xl text-xs font-black border transition-all cursor-pointer truncate ${
                                          formData.paymentMethod === metodo
                                            ? 'bg-orange-500 border-orange-400 text-white shadow-md scale-105'
                                            : 'bg-black/30 border-white/20 text-white/80 hover:bg-black/50'
                                        }`}
                                      >
                                        {metodo}
                                      </button>
                                    ))}
                                  </div>
                                </div>

                                <button 
                                  type="submit"
                                  className="w-full font-black py-2 rounded-xl transition shadow-xl text-xs uppercase tracking-wider cursor-pointer flex items-center justify-center gap-2 bg-stone-950 text-white hover:bg-black border border-white/20 mt-1"
                                >
                                  <i className="fa-brands fa-whatsapp text-sm text-emerald-400"></i>
                                  Enviar Pedido por WhatsApp
                                </button>
                              </form>
                            </div>

                          </div>
                        )}
                      </div>
                    )}

                  </div>
                </div>
              )}

            </div>
          );
        }

        ReactDOM.render(<HofuLanding />, document.getElementById('root'));
    </script>
</body>
</html>
