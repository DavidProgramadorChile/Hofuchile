<head>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX en el navegador -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Control estricto para evitar scroll vertical no deseado */
        }

        /* Transiciones fluidas estilo app nativa */
        .native-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* Animación de Isla Dinámica (Estilo iPhone Pro Max avanzado) */
        @keyframes islandMorph {
            0% { transform: translateY(-30px) scale(0.85); opacity: 0; filter: blur(4px); }
            60% { transform: translateY(4px) scale(1.02); opacity: 1; filter: blur(0); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes islandDismiss {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.9); opacity: 0; filter: blur(2px); }
        }
        .dynamic-island-enter {
            animation: islandMorph 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .dynamic-island-exit {
            animation: islandDismiss 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Posicionamiento dinámico para Dynamic Island con área segura y soporte anti-cámara central móvil */
        .dynamic-island-wrapper {
            top: 0.5rem;
        }

        /* Efecto de Border Beam / Running Light (Haz de luz recorriendo el borde sincronizado al color del tema) */
        @keyframes borderBeamSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dynamic-island-border-beam {
            position: relative;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .dynamic-island-border-beam::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 270deg, var(--island-glow-color, rgba(255,255,255,0.9)) 330deg, transparent 360deg);
            animation: borderBeamSpin 3s linear infinite;
            pointer-events: none;
        }
        .dynamic-island-border-beam::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: rgba(10, 10, 10, 0.95);
            border-radius: 9999px;
            pointer-events: none;
        }

        /* Tamaño optimizado de Dynamic Island adaptativo: Compacto en Móvil, Más ancho y largo en Escritorio (PC) */
        .dynamic-island-content {
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: 0.375rem;
            padding-bottom: 0.375rem;
            font-size: 0.7rem;
        }
        @media (min-width: 1024px) {
            .dynamic-island-content {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                padding-top: 0.6rem;
                padding-bottom: 0.6rem;
                font-size: 0.875rem;
            }
        }

        /* Loader Circular de Puntos - Estilo Minimalista Oscuro / Negro Elegante */
        @keyframes circularLoaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .cart-loader-ring {
            position: absolute;
            inset: -5px;
            border-radius: 9999px;
            border: 3px dotted rgba(15, 23, 42, 0.85);
            animation: circularLoaderSpin 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.4));
        }

        /* Animación de pulso independiente para el contador numérico de alta gama */
        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .badge-bounce {
            animation: badgePop 0.3s ease-in-out;
        }

        /* Ocultar barras de scroll por defecto y mostrarlas con un estilo ultra sutil al hacer scroll */
        .categories-scroll::-webkit-scrollbar {
            height: 2px;
            display: block;
        }
        .categories-scroll {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s ease;
        }
        .categories-scroll.is-scrolling::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15); /* Negro ultra suave y semitransparente (15%) */
            border-radius: 9999px;
        }
        .categories-scroll.is-scrolling {
            scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
        }

        /* Ocultar barras de scroll generales */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

          "Peñalolén", "Providencia", "Pudahuel", "Quilicura", "Quinta Normal",

          "Santiago", "Vitacura"
        ];

        const METODOS_PAGO = ["Efectivo", "Tarjeta"];

        function HofuLanding() {
          const [activeCategory, setActiveCategory] = useState('favoritos');
          const [selectedItem, setSelectedItem] = useState(categoriesData.favoritos.items[0]);
          const [selectedFlavor, setSelectedFlavor] = useState('Coca-Cola');
          const [selectedProtein, setSelectedProtein] = useState('Pollo apanado');
          const [animating, setAnimating] = useState(false);
          const [quantity, setQuantity] = useState(1);
          const [specialNotes, setSpecialNotes] = useState('');

          const [isImageZoomed, setIsImageZoomed] = useState(false);

          const [soyaCount, setSoyaCount] = useState(1);
          const [teriyakiCount, setTeriyakiCount] = useState(0);

          const [searchOpen, setSearchOpen] = useState(false);
          const [searchQuery, setSearchQuery] = useState('');
          const [cartOpen, setCartOpen] = useState(false);

          const [cart, setCart] = useState(() => {
            try {
              const savedCart = localStorage.getItem('hofu_cart');
              return savedCart ? JSON.parse(savedCart) : [];
            } catch (e) {
              return [];
            }
          });

          const [orderSuccess, setOrderSuccess] = useState(false);
          const [badgePulsing, setBadgePulsing] = useState(false);
          const [loaderActive, setLoaderActive] = useState(false);

          // Estado para la notificación tipo Dynamic Island
          const [dynamicIsland, setDynamicIsland] = useState({ show: false, leaving: false, message: '¡Añadido con éxito! 🍣', icon: 'fa-solid fa-check' });

          // Lógica en tiempo real para el estado del local (11:00 AM a 00:00 AM)
          const [isOpen, setIsOpen] = useState(true);

          useEffect(() => {
            const checkStoreStatus = () => {
              const now = new Date();
              const hours = now.getHours();
              const currentlyOpen = hours >= 11 && hours < 24;
              setIsOpen(currentlyOpen);
            };

            checkStoreStatus();
            const interval = setInterval(checkStoreStatus, 60000);
            return () => clearInterval(interval);
          }, []);

          const [formData, setFormData] = useState({ 
            fullName: '', 
            address: '', 
            comuna: 'Santiago', 
            phone: '',
            paymentMethod: 'Efectivo'
          });

          const [comunaDropdownOpen, setComunaDropdownOpen] = useState(false);
          const [comunaSearch, setComunaSearch] = useState('');
          const [paymentDropdownOpen, setPaymentDropdownOpen] = useState(false);

          const comunaRef = useRef(null);
          const paymentRef = useRef(null);
          const searchContainerRef = useRef(null);
          
          const mobileCategoriesRef = useRef(null);
          const isUserInteractingRef = useRef(false);
          const scrollDirectionRef = useRef(1);

          // Control de visibilidad del thumb de scrollbar en categorías
          const [isScrollingCategories, setIsScrollingCategories] = useState(false);
          const scrollTimeoutRef = useRef(null);

          const handleCategoriesScroll = () => {
            setIsScrollingCategories(true);
            if (scrollTimeoutRef.current) {
              clearTimeout(scrollTimeoutRef.current);
            }
            scrollTimeoutRef.current = setTimeout(() => {
              setIsScrollingCategories(false);
            }, 600);
          };

          // Validar si la categoría actual permite notas y salsas (excluye bebidas y extras)
          const allowCustomizations = activeCategory !== 'bebidas' && activeCategory !== 'extras';

          useEffect(() => {
            const container = mobileCategoriesRef.current;
            if (!container) return;
            let animationFrameId;

            const autoScroll = () => {
              if (!isUserInteractingRef.current && container) {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                if (maxScrollLeft > 0) {
                  container.scrollLeft += 0.4 * scrollDirectionRef.current;
                  if (container.scrollLeft >= maxScrollLeft - 1) {
                    scrollDirectionRef.current = -1;
                  } else if (container.scrollLeft <= 1) {
                    scrollDirectionRef.current = 1;
                  }
                }
              }
              animationFrameId = requestAnimationFrame(autoScroll);
            };

            const timer = setTimeout(() => {
              animationFrameId = requestAnimationFrame(autoScroll);
            }, 1500);

            return () => {
              clearTimeout(timer);
              cancelAnimationFrame(animationFrameId);
            };
          }, []);

          useEffect(() => {
            setSoyaCount(quantity);
            setTeriyakiCount(0);
          }, [quantity]);

          useEffect(() => {
            try {
              localStorage.setItem('hofu_cart', JSON.stringify(cart));
            } catch (e) {}
          }, [cart]);

          useEffect(() => {
            function handleClickOutside(event) {
              if (comunaRef.current && !comunaRef.current.contains(event.target)) {
                setComunaDropdownOpen(false);
              }
              if (paymentRef.current && !paymentRef.current.contains(event.target)) {
                setPaymentDropdownOpen(false);
              }
              if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                setSearchOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const handleCategoryChange = (categoryKey) => {
            if (categoryKey === activeCategory) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setActiveCategory(categoryKey);
            const firstItem = categoriesData[categoryKey].items[0];
            setSelectedItem(firstItem);
            setSelectedFlavor('Coca-Cola');
            if (firstItem.hasProteinSelector && firstItem.proteinas) {
              setSelectedProtein(firstItem.proteinas[0]);
            }
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setSpecialNotes('');
            setTimeout(() => setAnimating(false), 350);
          };

          const handleItemChange = (item) => {
            if (item.id === selectedItem.id) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            if (item.hasProteinSelector && item.proteinas) {
              setSelectedProtein(item.proteinas[0]);
            }
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setSpecialNotes('');
            setTimeout(() => setAnimating(false), 350);
          };

          const decreaseQty = () => {
            if (quantity > 1) {
              const newQty = quantity - 1;
              setQuantity(newQty);
              if (soyaCount + teriyakiCount > newQty) {
                if (soyaCount > 0) setSoyaCount(prev => Math.max(0, prev - 1));
                else if (teriyakiCount > 0) setTeriyakiCount(prev => Math.max(0, prev - 1));
              }
            }
          };

          const increaseQty = () => {
            const newQty = quantity + 1;
            setQuantity(newQty);
            setSoyaCount(prev => prev + 1);
          };

          const updateSoya = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setSoyaCount(prev => prev + 1);
            } else {
              if (soyaCount > 0) setSoyaCount(prev => prev - 1);
            }
          };

          const updateTeriyaki = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setTeriyakiCount(prev => prev + 1);
            } else {
              if (teriyakiCount > 0) setTeriyakiCount(prev => prev - 1);
            }
          };

          // Disparar la isla dinámica con mensaje personalizado
          const triggerCustomDynamicIsland = (msg, iconClass = 'fa-solid fa-check') => {
            setDynamicIsland({ show: true, leaving: false, message: msg, icon: iconClass });
            setTimeout(() => {
              setDynamicIsland(prev => ({ ...prev, leaving: true }));
              setTimeout(() => {
                setDynamicIsland({ show: false, leaving: false, message: '', icon: '' });
              }, 350);
            }, 3600);
          };

          const addToCart = () => {
            setBadgePulsing(true);
            setLoaderActive(true);
            
            // Verificación para saber si estamos en PC (ancho >= 1024px)
            const isDesktop = window.innerWidth >= 1024;

            if (isDesktop && selectedItem.hasProteinSelector) {
              // Notificación detallada con proteína exclusivamente para PC
              triggerCustomDynamicIsland(`¡Añadido: ${selectedItem.title} de ${selectedProtein}! 🍣`, "fa-solid fa-check");
            } else if (isDesktop) {
              // Notificación detallada para productos normales en PC
              triggerCustomDynamicIsland(`¡Añadido: ${selectedItem.title}! 🍣`, "fa-solid fa-check");
            } else {
              // Versión móvil intacta: estándar
              triggerCustomDynamicIsland(`¡Añadido con éxito! 🍣`, "fa-solid fa-check");
            }

            setTimeout(() => {
              setBadgePulsing(false);
              setLoaderActive(false);
            }, 1800);

            let variantSuffix = '';
            if (selectedItem.hasFlavorSelector) {
              variantSuffix = ` (${selectedFlavor})`;
            } else if (selectedItem.hasProteinSelector) {
              variantSuffix = ` [Proteína: ${selectedProtein}]`;
            }
            
            let saucesParts = [];
            if (allowCustomizations) {
              if (soyaCount > 0) saucesParts.push(`${soyaCount} Soya`);
              if (teriyakiCount > 0) saucesParts.push(`${teriyakiCount} Teriyaki`);
            }
            const saucesSuffix = saucesParts.length > 0 ? ` [Salsas: ${saucesParts.join(', ')}]` : '';
            const notesSuffix = (allowCustomizations && specialNotes.trim() !== '') ? ` [Nota: "${specialNotes.trim()}"]` : '';

            const cartItemId = `${selectedItem.id}${variantSuffix}|S${soyaCount}T${teriyakiCount}|N${specialNotes}`;
            const cartItemTitle = `${selectedItem.title}${variantSuffix}${saucesSuffix}${notesSuffix}`;

            setCart(prevCart => {
              const existingIndex = prevCart.findIndex(item => item.cartItemId === cartItemId);
              if (existingIndex > -1) {
                const updated = [...prevCart];
                updated[existingIndex].quantity += quantity;
                return updated;
              } else {
                return [...prevCart, { 
                  ...selectedItem, 
                  cartItemId, 
                  displayTitle: cartItemTitle, 
                  quantity 
                }];
              }
            });
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setSpecialNotes('');
          };

          const updateCartItemQty = (cartItemId, delta) => {
            setCart(prevCart => {
              return prevCart.map(item => {
                if (item.cartItemId === cartItemId) {
                  const newQty = item.quantity + delta;
                  return newQty > 0 ? { ...item, quantity: newQty } : null;
                }
                return item;
              }).filter(Boolean);
            });
          };

          const removeCartItem = (cartItemId) => {
            setCart(prevCart => prevCart.filter(item => item.cartItemId !== cartItemId));
          };

          const clearCart = () => {
            setCart([]);
            try { localStorage.removeItem('hofu_cart'); } catch (e) {}
          };

          const allProducts = Object.values(categoriesData).flatMap(cat => cat.items);

                              <span className="text-xs font-bold">Teriyaki</span>
                              <div className="flex items-center gap-1.5">
                                <button onClick={() => updateTeriyaki(-1)} className="w-5 h-5 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[10px] font-bold active:scale-90">
                                  <i className="fa-solid fa-minus"></i>
                                </button>
                                <span className="text-xs font-bold w-3 text-center">{teriyakiCount}</span>
                                <button onClick={() => updateTeriyaki(1)} className="w-5 h-5 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[10px] font-bold active:scale-90">
                                  <i className="fa-solid fa-plus"></i>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="flex items-center gap-3 pt-1 pb-0.5">
                        <div className={`flex items-center rounded-full border px-3 py-1 ${isLight ? 'bg-black/5 border-stone-900/20' : 'bg-black/30 border-white/25'} backdrop-blur-md`}>
                          <button onClick={decreaseQty} className="w-6 h-6 flex items-center justify-center font-bold text-xs active:scale-90">
                            <i className="fa-solid fa-minus text-[10px]"></i>
                          </button>
                          <span className="w-6 text-center font-bold text-xs">{quantity}</span>
                          <button onClick={increaseQty} className="w-6 h-6 flex items-center justify-center font-bold text-xs active:scale-90">
                            <i className="fa-solid fa-plus text-[10px]"></i>
                          </button>
                        </div>

                        <button 
                          onClick={addToCart}
                          disabled={allowCustomizations && (soyaCount + teriyakiCount !== quantity)}
                          className={`font-semibold px-6 py-2 rounded-full flex items-center gap-2 transition active:scale-95 shadow-xl text-xs group cursor-pointer border ${
                            allowCustomizations && (soyaCount + teriyakiCount !== quantity)
                              ? 'opacity-50 cursor-not-allowed bg-stone-800 text-white/50 border-white/10' 
                              : isLight ? 'bg-stone-950 text-white border-black hover:bg-stone-900' : 'bg-stone-950 text-white border-white/20 hover:bg-black'
                          }`}
                        >
                          Añadir al carrito 
                          <span className="w-4 h-4 bg-white text-stone-950 rounded-full flex items-center justify-center text-[10px] font-bold">
                            <i className="fa-solid fa-plus text-[8px]"></i>
                          </span>
                        </button>
                      </div>
                    </div>

                  </div>

                  {/* Columna Derecha: Precio (alineado de forma armónica a la altura del título) y Miniaturas inferiores */}
                  <div className="lg:col-span-3 flex flex-col justify-center items-center lg:items-end space-y-3 lg:space-y-6 order-3 pb-2 sm:pb-3 lg:pb-0">
                    <div className={`hidden lg:flex flex-col text-center lg:text-right space-y-1 transition-all duration-300 ease-out ${animating ? 'opacity-0 scale-90 translate-y-2' : 'opacity-100 scale-100 translate-y-0'}`}>
                      <div className="text-5xl lg:text-6xl font-extrabold tracking-tight text-white drop-shadow-sm leading-tight lg:pt-3">
                        {selectedItem.price}
                      </div>
                    </div>

                    <div className={`flex lg:hidden text-3xl font-extrabold text-white drop-shadow-md my-1 transition-all duration-300 ease-out ${animating ? 'opacity-0' : 'opacity-100'}`}>
                      {selectedItem.price}
                    </div>

                    {/* Contenedor de miniaturas con respiro seguro */}
                    <div className="space-y-2 w-full flex flex-col items-center lg:items-end pb-2 sm:pb-3 lg:pb-0">
                      <div className="flex gap-2.5 sm:gap-3 justify-center lg:justify-end flex-wrap max-w-xs lg:max-w-sm">
                        {categoriesData[activeCategory].items.map((item) => (
                          <button
                            key={item.id}
                            onClick={() => handleItemChange(item)}
                            className={`w-14 h-16 sm:w-16 sm:h-20 lg:w-20 lg:h-24 rounded-2xl overflow-hidden border-2 transition-all duration-300 relative cursor-pointer active:scale-95 ${isLight ? 'bg-black/10' : 'bg-black/30'} shadow-md flex items-center justify-center p-1.5 lg:p-2 ${
                              selectedItem.id === item.id
                                ? `${isLight ? 'border-stone-950 ring-2 ring-stone-950/40' : 'border-white ring-2 ring-white/50'} scale-110 shadow-2xl`
                                : `${isLight ? 'border-stone-900/30 opacity-70 hover:opacity-100' : 'border-white/30 opacity-70 hover:opacity-100'}`
                            }`}
                          >
                            <img 
                              src={item.image} 
                              alt={item.title} 
                              className="w-full h-full object-cover rounded-xl"
                              onError={(e)=>{
                                e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800";
                              }}
                            />
                          </button>
                        ))}
                      </div>
                    </div>

                  </div>

                </div>
              </main>

              {/* Modal de Resumen de Pedido & Formulario WhatsApp */}
              {cartOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                  
                  <div className={`bg-gradient-to-br ${selectedItem.bgGradient} ${isLight ? 'text-stone-950' : 'text-white'} rounded-3xl max-w-4xl lg:max-w-6xl w-full p-6 lg:p-12 shadow-2xl border ${isLight ? 'border-stone-900/20' : 'border-white/20'} relative animate-in fade-in zoom-in duration-200 max-h-[92vh] lg:max-h-[90vh] overflow-y-auto no-scrollbar`}>
                    
                    <button 
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setCartOpen(false);
                      }}
                      className={`absolute top-6 right-6 w-9 h-9 rounded-full ${isLight ? 'bg-black/10 hover:bg-black/20 text-stone-950' : 'bg-white/10 hover:bg-white/20 text-white'} flex items-center justify-center transition active:scale-90 cursor-pointer z-20 font-bold text-sm`}
                    >
                      <i className="fa-solid fa-xmark text-xs"></i>
                    </button>

                    <h3 className="text-2xl lg:text-3xl font-extrabold mb-6 tracking-wide drop-shadow-sm pr-12">Resumen de tu Pedido</h3>

                    {!isOpen && (
                      <div className="mb-6 bg-amber-500/20 border border-amber-400/40 p-3.5 rounded-2xl text-xs lg:text-sm flex items-center gap-3 text-amber-200">
                        <i className="fa-solid fa-clock text-amber-400 text-base"></i>
                        <span>El local se encuentra cerrado en este momento. Tu pedido se enviará programado para la próxima apertura (11:00 AM).</span>
                      </div>
                    )}

                    {orderSuccess ? (
                      <div className="py-20 text-center space-y-4">
                        <div className="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                          <i className="fa-solid fa-check text-2xl"></i>
                        </div>
                        <h4 className="text-xl font-bold">¡Redirigiendo a WhatsApp!</h4>
                        <p className="text-sm opacity-80">Se abrió tu chat con el pedido detallado. ¡Gracias por elegir HŌFU!</p>
                      </div>
                    ) : cart.length === 0 ? (
                      <div className="py-20 text-center opacity-70 text-base space-y-3">
                        <i className="fa-solid fa-bag-shopping text-5xl opacity-40 block mb-2"></i>
                        Tu bolsa de compras está vacía. ¡Añade tus platos favoritos!
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 items-start">
                        
                        <div className="lg:col-span-5 flex flex-col space-y-4">
                          <div className="flex items-center justify-between border-b pb-3 border-white/15">
                            <span className="text-xs uppercase tracking-wider font-bold opacity-90">Productos en tu bolsa</span>
                            <button 
                              onClick={clearCart}
                              className="text-xs font-bold text-red-400 hover:text-red-300 transition flex items-center gap-1.5 cursor-pointer active:scale-95"
                            >
                              <i className="fa-solid fa-trash-can text-xs"></i> Vaciar carrito
                            </button>
                          </div>

                          <div className="space-y-3 max-h-60 lg:max-h-96 overflow-y-auto no-scrollbar pr-1">
                            {cart.map((item) => (
                              <div key={item.cartItemId} className={`flex items-center justify-between ${isLight ? 'bg-white/40 border-stone-900/10' : 'bg-black/40 border-white/10'} backdrop-blur-md p-3 rounded-2xl border gap-3`}>
                                <div className="flex items-center gap-3 min-w-0 flex-1">
                                  <img src={item.image} alt={item.title} className="w-12 h-12 object-cover rounded-xl shrink-0" />
                                  <div className="min-w-0 flex-1">
                                    <h4 className="font-bold text-xs lg:text-sm leading-tight truncate">{item.displayTitle}</h4>
                                    <p className="text-xs text-orange-400 font-bold">{item.price} c/u</p>
                                  </div>
                                </div>
                                <div className="flex items-center gap-3 shrink-0">
                                  <div className={`flex items-center ${isLight ? 'bg-white/60 border-stone-900/20' : 'bg-stone-900 border-white/20'} border rounded-xl px-2 py-1`}>
                                    <button onClick={() => updateCartItemQty(item.cartItemId, -1)} className="px-1.5 text-xs font-bold cursor-pointer active:scale-90">
                                      <i className="fa-solid fa-minus text-[8px]"></i>
                                    </button>
                                    <span className="w-6 text-center text-xs font-bold">{item.quantity}</span>
                                    <button onClick={() => updateCartItemQty(item.cartItemId, 1)} className="px-1.5 text-xs font-bold cursor-pointer active:scale-90">
                                      <i className="fa-solid fa-plus text-[8px]"></i>
                                    </button>
                                  </div>
                                  <span className="font-bold text-xs lg:text-sm w-16 text-right">${(item.rawPrice * item.quantity).toLocaleString('es-CL')}</span>
                                  <button 
                                    onClick={() => removeCartItem(item.cartItemId)}
                                    className="w-7 h-7 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition cursor-pointer text-xs active:scale-90"
                                    title="Eliminar producto"
                                  >
                                    <i className="fa-solid fa-trash-can text-[10px]"></i>
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>

                          <div className={`flex justify-between items-center pt-4 border-t ${isLight ? 'border-stone-900/20' : 'border-white/20'} font-bold text-base lg:text-xl`}>
                            <span>Total a pagar:</span>
                            <span className="text-orange-400 text-xl lg:text-2xl">
                              ${totalCartAmount.toLocaleString('es-CL')}
                            </span>
                          </div>
                        </div>

                        <div className="lg:col-span-7 flex flex-col space-y-4">
                          <form onSubmit={handleCheckoutSubmit} className="space-y-4">
                            <h4 className="text-xs font-bold uppercase tracking-wider opacity-90">Datos de Entrega & Pago (Santiago)</h4>
                            
                            <input 
                              type="text" 
                              placeholder="Nombre y Apellido *" 
                              required
                              value={formData.fullName}
                              onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                              className={`w-full ${isLight ? 'bg-white/60 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/40 border-white/20 text-white placeholder-white/50'} backdrop-blur-md border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-orange-500 transition`}
                            />

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <input 
                                type="text" 
                                placeholder="Dirección exacta (Calle, N° de depto/casa) *" 
                                required
                                value={formData.address}
                                onChange={(e) => setFormData({...formData, address: e.target.value})}
                                className={`w-full ${isLight ? 'bg-white/60 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/40 border-white/20 text-white placeholder-white/50'} backdrop-blur-md border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-orange-500 transition`}
                              />

                              <div className="relative" ref={comunaRef}>
                                <div 
                                  onClick={() => setComunaDropdownOpen(!comunaDropdownOpen)}
                                  className={`w-full ${isLight ? 'bg-white/60 border-stone-900/20 text-stone-950' : 'bg-black/40 border-white/20 text-white'} backdrop-blur-md border rounded-2xl px-4 py-3 text-xs lg:text-sm flex items-center justify-between cursor-pointer transition select-none`}
                                >
                                  <span className="truncate">{formData.comuna}</span>
                                  <i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>

                                {comunaDropdownOpen && (
                                  <div className={`absolute left-0 right-0 mt-2 ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-stone-900 text-white border-white/10'} rounded-2xl shadow-2xl border z-50 p-3`}>
                                    <div className={`flex items-center gap-2 ${isLight ? 'bg-stone-100 border-stone-200 text-stone-900' : 'bg-stone-800 border-white/10 text-white'} px-3 py-2 rounded-xl border mb-2`}>
                                      <i className="fa-solid fa-search text-xs opacity-50"></i>
                                      <input 
                                        type="text" 
                                        placeholder="Buscar comuna..."
                                        value={comunaSearch}
                                        onChange={(e) => setComunaSearch(e.target.value)}
                                        autoFocus
                                        className="bg-transparent w-full text-xs lg:text-sm outline-none placeholder-current placeholder-opacity-50"
                                      />
                                    </div>
                                    <div className="max-h-48 overflow-y-auto space-y-1 pr-1 no-scrollbar">
                                      {filteredComunas.length > 0 ? (
                                        filteredComunas.map((comuna) => (
                                          <div 
                                            key={comuna}
                                            onClick={() => {
                                              setFormData({...formData, comuna});
                                              setComunaDropdownOpen(false);
                                              setComunaSearch('');
                                            }}
                                            className={`px-3.5 py-2 rounded-xl text-xs lg:text-sm cursor-pointer transition active:scale-98 ${
                                              formData.comuna === comuna 
                                                ? 'bg-orange-500 text-white font-bold' 
                                                : `${isLight ? 'hover:bg-stone-100' : 'hover:bg-white/10'}`
                                            }`}
                                          >
                                            {comuna}
                                          </div>
                                        ))
                                      ) : (
                                        <div className="p-3 text-center text-xs opacity-50">No hay resultados</div>
                                      )}
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <input 
                                type="tel" 
                                placeholder="Teléfono / WhatsApp (+56 9...) *" 
                                required
                                value={formData.phone}
                                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                className={`w-full ${isLight ? 'bg-white/60 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/40 border-white/20 text-white placeholder-white/50'} backdrop-blur-md border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-orange-500 transition`}
                              />

                              <div className="relative" ref={paymentRef}>
                                <div 
                                  onClick={() => setPaymentDropdownOpen(!paymentDropdownOpen)}
                                  className={`w-full ${isLight ? 'bg-white/60 border-stone-900/20 text-stone-950' : 'bg-black/40 border-white/20 text-white'} backdrop-blur-md border rounded-2xl px-4 py-3 text-xs lg:text-sm flex items-center justify-between cursor-pointer transition select-none`}
                                >
                                  <span className="truncate">Pago: {formData.paymentMethod}</span>
                                  <i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>

                                {paymentDropdownOpen && (
                                  <div className={`absolute left-0 right-0 mt-2 ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-stone-900 text-white border-white/10'} rounded-2xl shadow-2xl border z-50 p-2 space-y-1`}>
                                    {METODOS_PAGO.map((metodo) => (
                                      <div 
                                        key={metodo}
                                        onClick={() => {
                                          setFormData({...formData, paymentMethod: metodo});
                                          setPaymentDropdownOpen(false);
                                        }}
                                        className={`px-3.5 py-2.5 rounded-xl text-xs lg:text-sm cursor-pointer transition active:scale-98 ${
                                          formData.paymentMethod === metodo 
                                            ? 'bg-orange-500 text-white font-bold' 
                                            : `${isLight ? 'hover:bg-stone-100' : 'hover:bg-white/10'}`
                                        }`}
                                      >
                                        {metodo}
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <button 
                              type="submit"
                              className="w-full bg-stone-950 hover:bg-black text-white border border-white/20 font-bold py-4 rounded-2xl transition active:scale-95 shadow-xl text-xs lg:text-sm uppercase tracking-wider cursor-pointer mt-3 flex items-center justify-center gap-3"
                            >
                              <i className="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
                              Enviar Pedido por WhatsApp
                            </button>
                          </form>
                        </div>

                      </div>
                    )}

                  </div>
                </div>
              )}

            </div>
          );
        }

        // Renderizado optimizado con React 18 createRoot
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<HofuLanding />);
    </script>
</body>
</html>
