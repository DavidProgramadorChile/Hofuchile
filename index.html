        @keyframes islandMorph {
            0% { transform: translateY(-30px) scale(0.85); opacity: 0; filter: blur(4px); }
            60% { transform: translateY(4px) scale(1.02); opacity: 1; filter: blur(0); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes islandDismiss {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.9); opacity: 0; filter: blur(2px); }
        }
        .dynamic-island-enter {
            animation: islandMorph 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .dynamic-island-exit {
            animation: islandDismiss 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .dynamic-island-wrapper {
            top: 0.5rem;
        }

        @keyframes borderBeamSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dynamic-island-border-beam {
            position: relative;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .dynamic-island-border-beam::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 270deg, var(--island-glow-color, rgba(255,255,255,0.9)) 330deg, transparent 360deg);
            animation: borderBeamSpin 3s linear infinite;
            pointer-events: none;
        }
        .dynamic-island-border-beam::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: rgba(10, 10, 10, 0.95);
            border-radius: 9999px;
            pointer-events: none;
        }

        .dynamic-island-content {
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: 0.375rem;
            padding-bottom: 0.375rem;
            font-size: 0.7rem;
        }
        @keyframes circularLoaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .cart-loader-ring {
            position: absolute;
            inset: -5px;
            border-radius: 9999px;
            border: 3px dotted rgba(15, 23, 42, 0.85);
            animation: circularLoaderSpin 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.4));
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .badge-bounce {
            animation: badgePop 0.3s ease-in-out;
        }

        function HofuLanding() {
          const [activeCategory, setActiveCategory] = useState('tempurarolls');
          const [selectedItem, setSelectedItem] = useState(categoriesData.tempurarolls.items[4]); // Tori Roll por defecto
          const [selectedFlavor, setSelectedFlavor] = useState('Coca-Cola');
          const [selectedProtein, setSelectedProtein] = useState('Pollo apanado');
          const [selectedEnvoltura, setSelectedEnvoltura] = useState('Palta');
          const [animating, setAnimating] = useState(false);
          const [quantity, setQuantity] = useState(1);

          const [isImageZoomed, setIsImageZoomed] = useState(false);

          const [soyaCount, setSoyaCount] = useState(1);
          const [teriyakiCount, setTeriyakiCount] = useState(0);

          const [searchOpen, setSearchOpen] = useState(false);
          const [searchQuery, setSearchQuery] = useState('');
          const [cartOpen, setCartOpen] = useState(false);

          const [cart, setCart] = useState([]);

          const [orderSuccess, setOrderSuccess] = useState(false);
          const [badgePulsing, setBadgePulsing] = useState(false);
          const [loaderActive, setLoaderActive] = useState(false);

          const [dynamicIsland, setDynamicIsland] = useState({ show: false, leaving: false, message: '¡Añadido con éxito! 🍣', icon: 'fa-solid fa-check' });

          const [isOpen, setIsOpen] = useState(true);

          useEffect(() => {
            const checkStoreStatus = () => {
              const now = new Date();
              const hours = now.getHours();
              const minutes = now.getMinutes();
              const currentTimeMinutes = hours * 60 + minutes;
              const openTimeMinutes = 12 * 60; 
              const closeTimeMinutes = 23 * 60 + 30; 
              const currentlyOpen = currentTimeMinutes >= openTimeMinutes && currentTimeMinutes < closeTimeMinutes;
              setIsOpen(currentlyOpen);
            };

            checkStoreStatus();
            const interval = setInterval(checkStoreStatus, 60000);
            return () => clearInterval(interval);
          }, []);

          const [formData, setFormData] = useState({ 
            fullName: '', 
            address: '', 
            comuna: 'Santiago', 
            phone: '',
            paymentMethod: 'Efectivo'
          });

          const [comunaDropdownOpen, setComunaDropdownOpen] = useState(false);
          const [comunaSearch, setComunaSearch] = useState('');
          const [paymentDropdownOpen, setPaymentDropdownOpen] = useState(false);

          const comunaRef = useRef(null);
          const paymentRef = useRef(null);
          const searchContainerRef = useRef(null);
          
          const mobileCategoriesRef = useRef(null);
          const isUserInteractingRef = useRef(false);
          const scrollDirectionRef = useRef(1);

          const [isScrollingCategories, setIsScrollingCategories] = useState(false);
          const scrollTimeoutRef = useRef(null);

          const handleCategoriesScroll = () => {
            setIsScrollingCategories(true);
            if (scrollTimeoutRef.current) {
              clearTimeout(scrollTimeoutRef.current);
            }
            scrollTimeoutRef.current = setTimeout(() => {
              setIsScrollingCategories(false);
            }, 600);
          };

          const allowCustomizations = activeCategory !== 'bebidas' && activeCategory !== 'extras';
          
          const isExtra = activeCategory === 'extras';
          const isGohan = activeCategory === 'gohan';

          useEffect(() => {
            const container = mobileCategoriesRef.current;
            if (!container) return;
            let animationFrameId;

            const autoScroll = () => {
              if (!isUserInteractingRef.current && container) {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                if (maxScrollLeft > 0) {
                  container.scrollLeft += 0.4 * scrollDirectionRef.current;
                  if (container.scrollLeft >= maxScrollLeft - 1) {
                    scrollDirectionRef.current = -1;
                  } else if (container.scrollLeft <= 1) {
                    scrollDirectionRef.current = 1;
                  }
                }
              }
              animationFrameId = requestAnimationFrame(autoScroll);
            };

            const timer = setTimeout(() => {
              animationFrameId = requestAnimationFrame(autoScroll);
            }, 1500);

            return () => {
              clearTimeout(timer);
              cancelAnimationFrame(animationFrameId);
            };
          }, []);

          useEffect(() => {
            setSoyaCount(quantity);
            setTeriyakiCount(0);
          }, [quantity]);

          useEffect(() => {
            function handleClickOutside(event) {
              if (comunaRef.current && !comunaRef.current.contains(event.target)) {
                setComunaDropdownOpen(false);
              }
              if (paymentRef.current && !paymentRef.current.contains(event.target)) {
                setPaymentDropdownOpen(false);
              }
              if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                setSearchOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const handleCategoryChange = (categoryKey) => {
            if (categoryKey === activeCategory) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setActiveCategory(categoryKey);
            const firstItem = categoriesData[categoryKey].items[0];
            setSelectedItem(firstItem);
            setSelectedFlavor('Coca-Cola');
            if (firstItem.hasProteinSelector && firstItem.proteinas) {
              setSelectedProtein(firstItem.proteinas[0]);
            }
            setSelectedEnvoltura('Palta');
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setTimeout(() => setAnimating(false), 350);
          };

          const handleItemChange = (item) => {
            if (item.id === selectedItem.id) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            if (item.hasProteinSelector && item.proteinas) {
              setSelectedProtein(item.proteinas[0]);
            }
            setSelectedEnvoltura('Palta');
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setTimeout(() => setAnimating(false), 350);
          };

          const decreaseQty = () => {
            if (quantity > 1) {
              const newQty = quantity - 1;
              setQuantity(newQty);
              if (soyaCount + teriyakiCount > newQty) {
                if (soyaCount > 0) setSoyaCount(prev => Math.max(0, prev - 1));
                else if (teriyakiCount > 0) setTeriyakiCount(prev => Math.max(0, prev - 1));
              }
            }
          };

          const increaseQty = () => {
            const newQty = quantity + 1;
            setQuantity(newQty);
            setSoyaCount(prev => prev + 1);
          };

          const updateSoya = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setSoyaCount(prev => prev + 1);
            } else {
              if (soyaCount > 0) setSoyaCount(prev => prev - 1);
            }
          };

          const updateTeriyaki = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setTeriyakiCount(prev => prev + 1);
            } else {
              if (teriyakiCount > 0) setTeriyakiCount(prev => prev - 1);
            }
          };

          const triggerCustomDynamicIsland = (msg, iconClass = 'fa-solid fa-check') => {

                                        ))
                                      ) : (
                                        <div className="p-3 text-center text-xs opacity-50">No hay resultados</div>
                                      )}
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <input 
                                type="tel" 
                                placeholder="Teléfono / WhatsApp (+56 9...) *" 
                                required
                                value={formData.phone}
                                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                className="w-full bg-black/50 border border-white/20 text-white placeholder-white/50 shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] backdrop-blur-lg rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-white transition"
                              />

                              <div className="relative" ref={paymentRef}>
                                <div 
                                  onClick={() => setPaymentDropdownOpen(!paymentDropdownOpen)}
                                  className="w-full bg-black/50 border border-white/20 text-white shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] backdrop-blur-lg rounded-2xl px-4 py-3 text-xs lg:text-sm flex items-center justify-between cursor-pointer transition select-none"
                                >
                                  <span className="truncate">Pago: {formData.paymentMethod}</span>
                                  <i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>

                                {paymentDropdownOpen && (
                                  <div className="absolute left-0 right-0 mt-2 bg-stone-900/95 text-white border border-white/20 backdrop-blur-xl rounded-2xl shadow-2xl z-50 p-2 space-y-1">
                                    {METODOS_PAGO.map((metodo) => (
                                      <div 
                                        key={metodo}
                                        onClick={() => {
                                          setFormData({...formData, paymentMethod: metodo});
                                          setPaymentDropdownOpen(false);
                                        }}
                                        className={`px-3.5 py-2.5 rounded-xl text-xs lg:text-sm cursor-pointer transition active:scale-98 ${
                                          formData.paymentMethod === metodo 
                                            ? 'bg-stone-950 text-white font-bold border border-white/30 shadow-md' 
                                            : 'hover:bg-white/15'
                                        }`}
                                      >
                                        {metodo}
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <button 
                              type="submit"
                              className="w-full bg-stone-950 hover:bg-black text-white border border-white/25 font-bold py-4 rounded-2xl transition active:scale-95 shadow-[0_10px_30px_rgba(0,0,0,0.8)] text-xs lg:text-sm uppercase tracking-wider cursor-pointer mt-3 flex items-center justify-center gap-3"
                            >
                              <i className="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
                              Enviar Pedido por WhatsApp
                            </button>
                          </form>
                        </div>

                      </div>
                    )}

                  </div>
                </div>
              )}

            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<HofuLanding />);
    </script>
</body>
</html>
