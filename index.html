<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HŌFU - Menu Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .native-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .badge-bounce {
            animation: badgePop 0.3s ease-in-out;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media (max-width: 1023px) {
            html, body {
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                position: fixed;
                width: 100%;
                margin: 0;
                padding: 0;
            }
        }
    </style>
</head>
<body class="bg-amber-950 text-white selection:bg-orange-500 selection:text-white">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const categoriesData = {
          gohan: {
            name: 'GOHAN',
            items: [
              {
                id: 'salmon',
                title: 'Gohan Salmón',
                description: 'Base de Arroz • Salmón • Palta • Queso Crema • Cebollín',
                price: '$6.500',
                rawPrice: 6500,
                bgGradient: 'from-amber-700 via-orange-600 to-stone-950',
                isLight: false,
                image: 'img/gohansalmon.png',
              },
              {
                id: 'camaron',
                title: 'Gohan Camarón',
                description: 'Base de Arroz • Camarón Apanado • Palta • Queso Crema • Cebollín',
                price: '$6.000',
                rawPrice: 6000,
                bgGradient: 'from-rose-800 via-orange-700 to-stone-950',
                isLight: false,
                image: 'img/gohancamaron.png',
              },
              {
                id: 'pollo',
                title: 'Gohan Pollo',
                description: 'Base de Arroz • Pollo Apanado • Palta • Queso Crema • Cebollín',
                price: '$5.500',
                rawPrice: 5500,
                bgGradient: 'from-amber-400 via-yellow-400 to-orange-400',
                isLight: true,
                image: 'img/gohanpollo.png',
              },
            ]
          },
          rolls: {
            name: 'SPECIAL ROLLS',
            items: [
              {
                id: 'tempuraroll',
                title: 'Tempura Roll',
                description: 'Camarón Apanado • Palta • Queso Crema',
                price: '$4.800',
                rawPrice: 4800,
                bgGradient: 'from-amber-600 via-amber-700 to-stone-950',
                isLight: false,
                image: 'img/tempuraroll.png',
              },
              {
                id: 'eskimalroll',
                title: 'Eskimal Roll',
                description: 'Camarón • Palta • Queso Crema',
                price: '$4.600',
                rawPrice: 4600,
                bgGradient: 'from-teal-600 via-cyan-800 to-stone-950',
                isLight: false,
                image: 'img/eskimalroll.png',
              }
            ]
          },
          bebidas: {
            name: 'BEBIDAS',
            items: [
              {
                id: 'bebidal15',
                title: 'Bebidas de Lt 1.5',
                description: 'Bebida formato familiar 1.5 Litros bien fría para acompañar',
                price: '$2.500',
                rawPrice: 2500,
                bgGradient: 'from-red-800 via-stone-900 to-stone-950',
                isLight: false,
                image: 'img/bebida1.5.png',
                hasFlavorSelector: true
              },
              {
                id: 'bebidasa350',
                title: 'Bebibas 350 cc',
                description: 'Bebida en lata individual 350 cc refrescante',
                price: '$1.500',
                rawPrice: 1500,
                bgGradient: 'from-blue-800 via-indigo-900 to-stone-950',
                isLight: false,
                image: 'img/bebidaslata.png',
                hasFlavorSelector: true
              }
            ]
          },
          extras: {
            name: 'EXTRAS',
            items: [
              {
                id: 'soyaextra',
                title: 'Salsa Soya Extra',
                description: 'Porción adicional de salsa de soya tradicional',
                price: '$500',
                rawPrice: 500,
                bgGradient: 'from-amber-900 via-stone-900 to-stone-950',
                isLight: false,
                image: 'img/soyaextra.png',
              },
              {
                id: 'unaguiextra',
                title: 'Salsa Unagui Extra',
                description: 'Salsa dulce de anguila caramelizada adicional',
                price: '$800',
                rawPrice: 800,
                bgGradient: 'from-amber-800 via-orange-950 to-stone-950',
                isLight: false,
                image: 'img/unaguiextra.png',
              },
              {
                id: 'porcionpalta',
                title: 'Porción de Palta',
                description: 'Extra de palta fresca en láminas',
                price: '$1.200',
                rawPrice: 1200,
                bgGradient: 'from-emerald-700 via-green-900 to-stone-950',
                isLight: false,
                image: 'img/porcionpalta.png',
              },
              {
                id: 'quesocremaextra',
                title: 'Queso Crema Extra',
                description: 'Porción adicional de queso crema Philadelphia',
                price: '$1.000',
                rawPrice: 1000,
                bgGradient: 'from-yellow-700 via-amber-900 to-stone-950',
                isLight: false,
                image: 'img/quesocremaextra.png',
              }
            ]
          }
        };

        const SABORES_BEBIDAS = ["Coca-Cola", "Coca-Cola Zero", "Fanta", "Sprite"];
        const COMUNAS_SANTIAGO = [
          "Cerrillos", "Cerro Navia", "Conchalí", "El Bosque", "Estación Central", 
          "Huechuraba", "Independencia", "La Cisterna", "La Florida", "La Granja", 
          "La Pintana", "La Reina", "Las Condes", "Lo Barnechea", "Lo Espejo", 
          "Lo Prado", "Macul", "Maipú", "Ñuñoa", "Pedro Aguirre Cerda", 
          "Peñalolén", "Providencia", "Pudahuel", "Quilicura", "Quinta Normal", 
          "Recoleta", "Renca", "San Joaquín", "San Miguel", "San Ramón", 
          "Santiago", "Vitacura"
        ];
        const METODOS_PAGO = ["Efectivo", "Tarjeta"];

        function HofuLanding() {
          const [activeCategory, setActiveCategory] = useState('gohan');
          const [selectedItem, setSelectedItem] = useState(categoriesData.gohan.items[0]);
          const [selectedFlavor, setSelectedFlavor] = useState('Coca-Cola');
          const [animating, setAnimating] = useState(false);
          const [quantity, setQuantity] = useState(1);

          const [soyaCount, setSoyaCount] = useState(1);
          const [teriyakiCount, setTeriyakiCount] = useState(0);

          const [searchOpen, setSearchOpen] = useState(false);
          const [searchQuery, setSearchQuery] = useState('');
          const [cartOpen, setCartOpen] = useState(false);
          
          const [cart, setCart] = useState(() => {
            try {
              const savedCart = localStorage.getItem('hofu_cart');
              return savedCart ? JSON.parse(savedCart) : [];
            } catch (e) {
              return [];
            }
          });

          const [orderSuccess, setOrderSuccess] = useState(false);
          const [badgePulsing, setBadgePulsing] = useState(false);
          const [flyingItem, setFlyingItem] = useState(null);

          const [formData, setFormData] = useState({ 
            fullName: '', 
            address: '', 
            comuna: 'Santiago', 
            phone: '',
            paymentMethod: 'Efectivo'
          });

          const [comunaDropdownOpen, setComunaDropdownOpen] = useState(false);
          const [comunaSearch, setComunaSearch] = useState('');
          const [paymentDropdownOpen, setPaymentDropdownOpen] = useState(false);

          const comunaRef = useRef(null);
          const paymentRef = useRef(null);
          const searchContainerRef = useRef(null);
          const cartButtonRef = useRef(null);
          const productImgRef = useRef(null);

          useEffect(() => {
            setSoyaCount(quantity);
            setTeriyakiCount(0);
          }, [quantity]);

          useEffect(() => {
            try {
              localStorage.setItem('hofu_cart', JSON.stringify(cart));
            } catch (e) {}
          }, [cart]);

          useEffect(() => {
            function handleClickOutside(event) {
              if (comunaRef.current && !comunaRef.current.contains(event.target)) {
                setComunaDropdownOpen(false);
              }
              if (paymentRef.current && !paymentRef.current.contains(event.target)) {
                setPaymentDropdownOpen(false);
              }
              if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                setSearchOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const handleCategoryChange = (categoryKey) => {
            if (categoryKey === activeCategory) return;
            setAnimating(true);
            setActiveCategory(categoryKey);
            const firstItem = categoriesData[categoryKey].items[0];
            setSelectedItem(firstItem);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setTimeout(() => setAnimating(false), 350);
          };

          const handleItemChange = (item) => {
            if (item.id === selectedItem.id) return;
            setAnimating(true);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setTimeout(() => setAnimating(false), 350);
          };

          const decreaseQty = () => {
            if (quantity > 1) {
              const newQty = quantity - 1;
              setQuantity(newQty);
              if (soyaCount + teriyakiCount > newQty) {
                if (soyaCount > 0) setSoyaCount(prev => Math.max(0, prev - 1));
                else if (teriyakiCount > 0) setTeriyakiCount(prev => Math.max(0, prev - 1));
              }
            }
          };

          const increaseQty = () => {
            const newQty = quantity + 1;
            setQuantity(newQty);
            setSoyaCount(prev => prev + 1);
          };

          const updateSoya = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setSoyaCount(prev => prev + 1);
            } else {
              if (soyaCount > 0) setSoyaCount(prev => prev - 1);
            }
          };

          const updateTeriyaki = (delta) => {
            if (delta > 0) {
              if (soyaCount + teriyakiCount < quantity) setTeriyakiCount(prev => prev + 1);
            } else {
              if (teriyakiCount > 0) setTeriyakiCount(prev => prev - 1);
            }
          };

          const addToCart = () => {
            if (productImgRef.current && cartButtonRef.current) {
              const startRect = productImgRef.current.getBoundingClientRect();
              const endRect = cartButtonRef.current.getBoundingClientRect();

              setFlyingItem({
                image: selectedItem.image,
                startX: startRect.left + startRect.width / 2 - 25,
                startY: startRect.top + startRect.height / 2 - 25,
                endX: endRect.left + endRect.width / 2 - 25,
                endY: endRect.top + endRect.height / 2 - 25
              });

              setTimeout(() => {
                setFlyingItem(null);
                setBadgePulsing(true);
                setTimeout(() => setBadgePulsing(false), 300);
              }, 600);
            }

            const flavorSuffix = selectedItem.hasFlavorSelector ? ` (${selectedFlavor})` : '';
            let saucesSuffix = '';
            const isSausageAllowed = activeCategory === 'gohan' || activeCategory === 'rolls';
            if (isSausageAllowed) {
              let saucesParts = [];
              if (soyaCount > 0) saucesParts.push(`${soyaCount} Soya`);
              if (teriyakiCount > 0) saucesParts.push(`${teriyakiCount} Teriyaki`);
              saucesSuffix = saucesParts.length > 0 ? ` [Salsas: ${saucesParts.join(', ')}]` : '';
            }

            const cartItemId = `${selectedItem.id}${flavorSuffix}|S${soyaCount}T${teriyakiCount}`;
            const cartItemTitle = `${selectedItem.title}${flavorSuffix}${saucesSuffix}`;

            setCart(prevCart => {
              const existingIndex = prevCart.findIndex(item => item.cartItemId === cartItemId);
              if (existingIndex > -1) {
                const updated = [...prevCart];
                updated[existingIndex].quantity += quantity;
                return updated;
              } else {
                return [...prevCart, { ...selectedItem, cartItemId, displayTitle: cartItemTitle, quantity }];
              }
            });
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
          };

          const updateCartItemQty = (cartItemId, delta) => {
            setCart(prevCart => prev.map(item => {
              if (item.cartItemId === cartItemId) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            }).filter(Boolean));
          };

          const removeCartItem = (cartItemId) => {
            setCart(prevCart => prevCart.filter(item => item.cartItemId !== cartItemId));
          };

          const clearCart = () => {
            setCart([]);
            try { localStorage.removeItem('hofu_cart'); } catch (e) {}
          };

          const allProducts = Object.values(categoriesData).flatMap(cat => cat.items);
          const filteredProducts = searchQuery.trim() === '' ? [] : allProducts.filter(p => 
            p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.description.toLowerCase().includes(searchQuery.toLowerCase())
          );

          const selectSearchedItem = (item) => {
            const targetCat = Object.keys(categoriesData).find(catKey => 
              categoriesData[catKey].items.some(i => i.id === item.id)
            ) || 'gohan';
            
            setAnimating(true);
            setActiveCategory(targetCat);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            setQuantity(1);
            setSoyaCount(1);
            setTeriyakiCount(0);
            setSearchOpen(false);
            setSearchQuery('');
            setTimeout(() => setAnimating(false), 350);
          };

          const handleCheckoutSubmit = (e) => {
            e.preventDefault();
            if (!formData.fullName || !formData.address || !formData.phone) return;

            const totalAmount = cart.reduce((acc, item) => acc + (item.rawPrice * item.quantity), 0);
            let message = `*¡Hola HŌFU! Quisiera realizar el siguiente pedido:*\n\n*📋 DETALLE DE LA ORDEN:*\n`;
            cart.forEach((item, idx) => {
              message += `${idx + 1}. ${item.displayTitle} x${item.quantity} - $${(item.rawPrice * item.quantity).toLocaleString('es-CL')}\n`;
            });
            message += `\n*💰 Total a pagar:* $${totalAmount.toLocaleString('es-CL')}\n`;
            message += `*💳 Método de pago:* ${formData.paymentMethod}\n\n`;
            message += `*📍 DATOS DE ENTREGA:*\n• *Nombre:* ${formData.fullName}\n• *Dirección:* ${formData.address}\n• *Comuna:* ${formData.comuna}\n• *Teléfono:* ${formData.phone}\n`;

            const whatsappUrl = `https://wa.me/56920468336?text=${encodeURIComponent(message)}`;
            setOrderSuccess(true);
            
            setTimeout(() => {
              window.open(whatsappUrl, '_blank');
              setOrderSuccess(false);
              setCart([]);
              try { localStorage.removeItem('hofu_cart'); } catch (e) {}
              setCartOpen(false);
              setFormData({ fullName: '', address: '', comuna: 'Santiago', phone: '', paymentMethod: 'Efectivo' });
            }, 2000);
          };

          const isLight = selectedItem.isLight;
          const isSausageAllowed = activeCategory === 'gohan' || activeCategory === 'rolls';
          const filteredComunas = COMUNAS_SANTIAGO.filter(c => c.toLowerCase().includes(comunaSearch.toLowerCase()));

          return (
            <div className={`h-full w-full bg-gradient-to-br ${selectedItem.bgGradient} ${isLight ? 'text-stone-950' : 'text-white'} native-transition flex flex-col overflow-hidden select-none relative justify-between`}>
              
              {flyingItem && (
                <div style={{ position: 'fixed', left: `${flyingItem.startX}px`, top: `${flyingItem.startY}px`, zIndex: 9999, pointerEvents: 'none', animation: 'flyToCart 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards' }}>
                  <img src={flyingItem.image} alt="Flying item" className="w-14 h-14 object-contain drop-shadow-2xl rounded-full bg-black/40 p-1 border border-white/30" />
                </div>
              )}

              <style>{`
                @keyframes flyToCart {
                  0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
                  100% { transform: translate(${flyingItem ? flyingItem.endX - flyingItem.startX : 0}px, ${flyingItem ? flyingItem.endY - flyingItem.startY : 0}px) scale(0.15) rotate(360deg); opacity: 0.2; }
                }
              `}</style>

              {/* Navbar Principal */}
              <header className="w-full px-5 md:px-12 py-2 flex items-center justify-between z-30 max-w-7xl mx-auto relative shrink-0">
                <div className="flex items-center cursor-pointer">
                  <span className={`font-black tracking-[0.3em] text-2xl uppercase ${isLight ? 'text-stone-950' : 'text-white'}`}>HŌFU</span>
                </div>

                <nav className={`hidden md:flex items-center gap-1 ${isLight ? 'bg-black/10 border-stone-900/20 text-stone-900' : 'bg-black/20 border-white/20 text-white'} backdrop-blur-md px-4 py-1.5 rounded-full border text-xs tracking-wider font-medium shadow-md`}>
                  {Object.keys(categoriesData).map((catKey) => {
                    const isActive = activeCategory === catKey;
                    return (
                      <button key={catKey} onClick={() => handleCategoryChange(catKey)} className={`px-4 py-2 rounded-full transition-all duration-300 cursor-pointer ${isActive ? `${isLight ? 'bg-stone-950 text-white' : 'bg-white/25 text-white'} shadow-sm font-bold scale-105` : ''}`}>
                        {categoriesData[catKey].name}
                      </button>
                    );
                  })}
                </nav>

                <div className="flex items-center gap-3" ref={searchContainerRef}>
                  <div className="flex items-center relative">
                    {!searchOpen ? (
                      <button onClick={() => setSearchOpen(true)} className={`w-9 h-9 rounded-full ${isLight ? 'bg-black/10 border-stone-900/20 text-stone-900' : 'bg-black/20 border-white/20 text-white'} backdrop-blur-md flex items-center justify-center border transition cursor-pointer`}>
                        <i className="fa-solid fa-search text-xs"></i>
                      </button>
                    ) : (
                      <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full border ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-stone-900 text-white border-white/20'} shadow-lg w-48 sm:w-64`}>
                        <i className="fa-solid fa-search text-xs opacity-50 shrink-0"></i>
                        <input type="text" placeholder="Buscar plato..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} autoFocus className="bg-transparent w-full text-xs outline-none" />
                        <button onClick={() => { setSearchOpen(false); setSearchQuery(''); }} className="opacity-60 hover:opacity-100 text-xs"><i className="fa-solid fa-xmark"></i></button>
                      </div>
                    )}

                    {searchOpen && searchQuery.trim() !== '' && (
                      <div className={`absolute right-0 top-12 w-72 sm:w-80 ${isLight ? 'bg-white text-stone-950 border-stone-300' : 'bg-stone-900 text-white border-white/10'} p-3 rounded-2xl shadow-2xl border z-40`}>
                        <div className="max-h-48 overflow-y-auto space-y-1">
                          {filteredProducts.length > 0 ? filteredProducts.map(prod => (
                            <div key={prod.id} onClick={() => selectSearchedItem(prod)} className={`flex items-center justify-between p-2 rounded-xl ${isLight ? 'hover:bg-stone-100' : 'hover:bg-white/10'} cursor-pointer text-xs`}>
                              <div className="flex items-center gap-2"><img src={prod.image} alt={prod.title} className="w-8 h-8 object-cover rounded-lg" /><span className="font-semibold">{prod.title}</span></div>
                              <span className="font-bold text-orange-400">{prod.price}</span>
                            </div>
                          )) : <div className="p-3 text-center text-xs opacity-50">Sin resultados</div>}
                        </div>
                      </div>
                    )}
                  </div>

                  <button ref={cartButtonRef} onClick={() => setCartOpen(true)} className={`w-9 h-9 rounded-full ${isLight ? 'bg-black/10 border-stone-900/20 text-stone-900' : 'bg-black/20 border-white/20 text-white'} backdrop-blur-md flex items-center justify-center border transition relative cursor-pointer`}>
                    <i className="fa-solid fa-bag-shopping text-xs"></i>
                    {cart.reduce((sum, item) => sum + item.quantity, 0) > 0 && (
                      <span className={`absolute -top-1 -right-1 w-4 h-4 bg-orange-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold ${badgePulsing ? 'badge-bounce' : ''}`}>
                        {cart.reduce((sum, item) => sum + item.quantity, 0)}
                      </span>
                    )}
                  </button>
                </div>
              </header>

              {/* Menú de categorías móvil */}
              <div className={`flex md:hidden overflow-x-auto px-4 py-1 gap-2 scrollbar-none z-20 border-b ${isLight ? 'border-stone-900/10 bg-black/5 text-stone-900' : 'border-white/10 bg-black/15 text-white'} backdrop-blur-md shrink-0`}>
                {Object.keys(categoriesData).map((catKey) => {
                  const isActive = activeCategory === catKey;
                  return (
                    <button key={catKey} onClick={() => handleCategoryChange(catKey)} className={`px-3 py-0.5 rounded-full text-[10px] tracking-wider whitespace-nowrap transition-all duration-300 cursor-pointer ${isActive ? `${isLight ? 'bg-stone-950 text-white font-bold' : 'bg-white/30 text-white font-bold'} scale-105` : ''}`}>
                      {categoriesData[catKey].name}
                    </button>
                  );
                })}
              </div>

              {/* Main Area */}
              <main className="flex-1 flex items-center justify-center px-4 py-1 z-10 w-full overflow-hidden my-auto shrink-0">
                <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-2 lg:gap-12 items-center mx-auto h-full">
                  
                  {/* Desktop Izquierda */}
                  <div className="lg:col-span-5 hidden lg:flex flex-col justify-center space-y-4 order-1 text-left pt-2">
                    <div className={`space-y-4 transition-all duration-300 ${animating ? 'opacity-0 -translate-x-6 scale-95' : 'opacity-100 translate-x-0 scale-100'}`}>
                      <h1 className="text-4xl lg:text-6xl font-extrabold tracking-tight leading-tight whitespace-nowrap">{selectedItem.title}</h1>
                      <p className={`text-base lg:text-lg leading-relaxed max-w-md font-medium ${isLight ? 'text-stone-900/90' : 'text-white/95'}`}>{selectedItem.description}</p>
                      
                      {selectedItem.hasFlavorSelector && (
                        <div className="space-y-1.5 pt-1">
                          <label className="text-xs font-bold uppercase tracking-wider block">Elige tu sabor:</label>
                          <div className="flex flex-wrap gap-2">
                            {SABORES_BEBIDAS.map((flavor) => (
                              <button key={flavor} onClick={() => setSelectedFlavor(flavor)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all cursor-pointer ${selectedFlavor === flavor ? 'bg-orange-500 border-orange-400 text-white shadow-md scale-105' : 'bg-black/30 border-white/20 text-white/90'}`}>
                                {flavor}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="pt-2 flex items-center gap-4">
                        <div className={`flex items-center rounded-full border px-3 py-1.5 ${isLight ? 'bg-black/5 border-stone-900/20' : 'bg-black/30 border-white/25'} backdrop-blur-md`}>
                          <button onClick={decreaseQty} className="w-7 h-7 flex items-center justify-center font-bold text-base cursor-pointer"><i className="fa-solid fa-minus text-xs"></i></button>
                          <span className="w-8 text-center font-bold text-sm">{quantity}</span>
                          <button onClick={increaseQty} className="w-7 h-7 flex items-center justify-center font-bold text-base cursor-pointer"><i className="fa-solid fa-plus text-xs"></i></button>
                        </div>
                        <button onClick={addToCart} className="font-semibold px-8 py-3.5 rounded-full flex items-center gap-3 transition shadow-xl text-sm bg-stone-950 text-white border border-white/20 hover:bg-black cursor-pointer">
                          Añadir al carrito <span className="w-6 h-6 bg-white text-stone-950 rounded-full flex items-center justify-center text-xs font-bold"><i className="fa-solid fa-plus text-[10px]"></i></span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Versión Móvil: Título */}
                  <div className={`flex lg:hidden flex-col items-center text-center order-1 transition-all duration-300 ${animating ? 'opacity-0 scale-90' : 'opacity-100 scale-100'}`}>
                    <h1 className="text-2xl font-black tracking-tight text-white drop-shadow-md">{selectedItem.title}</h1>
                  </div>

                  {/* Imagen y controles móviles optimizados para ocupar todo el espacio superior */}
                  <div className="lg:col-span-4 relative flex flex-col items-center justify-center order-2 my-auto">
                    <div className="relative w-full h-[220px] sm:h-[250px] lg:h-[420px] flex items-center justify-center my-1">
                      <div className={`absolute w-56 h-56 ${isLight ? 'bg-white/70' : 'bg-white/25'} rounded-full blur-3xl pointer-events-none`}></div>
                      <img 
                        ref={productImgRef}
                        src={selectedItem.image} 
                        alt={selectedItem.title}
                        className={`max-h-full max-w-full object-contain drop-shadow-[0_25px_25px_rgba(0,0,0,0.6)] transition-all duration-400 scale-[1.9] sm:scale-[2.0] ${animating ? 'opacity-0 scale-75 rotate-3 translate-y-4' : 'opacity-100 scale-[1.9] sm:scale-[2.0] rotate-0 translate-y-0'}`}
                        onError={(e)=>{ e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800"; }}
                      />
                    </div>

                    {/* Descripción y Controles Móviles */}
                    <div className={`flex lg:hidden flex-col items-center text-center space-y-1 w-full px-2 mt-1 transition-all duration-300 ${animating ? 'opacity-0 translate-y-4' : 'opacity-100 translate-y-0'}`}>
                      <p className="text-[10px] font-medium leading-relaxed max-w-xs text-white/95 line-clamp-2">{selectedItem.description}</p>

                      {selectedItem.hasFlavorSelector && (
                        <div className="space-y-0.5 w-full max-w-xs">
                          <label className="text-[9px] font-bold uppercase tracking-wider block">Elige tu sabor:</label>
                          <div className="flex flex-wrap justify-center gap-1">
                            {SABORES_BEBIDAS.map((flavor) => (
                              <button key={flavor} onClick={() => setSelectedFlavor(flavor)} className={`px-2 py-0.5 rounded-lg text-[9px] font-semibold border transition-all cursor-pointer ${selectedFlavor === flavor ? 'bg-orange-500 border-orange-400 text-white shadow-md' : 'bg-black/30 border-white/20 text-white/90'}`}>
                                {flavor}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {isSausageAllowed && (
                        <div className="space-y-0.5 w-full max-w-xs bg-black/30 p-1.5 rounded-xl border border-white/15 shadow-md">
                          <div className="flex justify-between items-center px-1">
                            <span className="text-[9px] font-semibold text-white/95 flex items-center gap-1"><i className="fa-solid fa-utensils text-[8px] text-orange-400"></i> Elige tu salsa favorita</span>
                            <span className={`text-[9px] font-bold px-1.5 py-0 rounded-full ${soyaCount + teriyakiCount === quantity ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-orange-500/20 text-orange-300 border border-orange-500/30'}`}>
                              {soyaCount + teriyakiCount} / {quantity}
                            </span>
                          </div>
                          <div className="grid grid-cols-2 gap-1.5 pt-0.5">
                            <div className="flex items-center justify-between bg-black/30 px-2 py-0.5 rounded-lg border border-white/10">
                              <span className="text-[9px]">Soya</span>
                              <div className="flex items-center gap-1.5">
                                <button onClick={() => updateSoya(-1)} className="w-4 h-4 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[8px] font-bold cursor-pointer"><i className="fa-solid fa-minus"></i></button>
                                <span className="text-[10px] font-bold w-3 text-center">{soyaCount}</span>
                                <button onClick={() => updateSoya(1)} className="w-4 h-4 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[8px] font-bold cursor-pointer"><i className="fa-solid fa-plus"></i></button>
                              </div>
                            </div>
                            <div className="flex items-center justify-between bg-black/30 px-2 py-0.5 rounded-lg border border-white/10">
                              <span className="text-[9px]">Teriyaki</span>
                              <div className="flex items-center gap-1.5">
                                <button onClick={() => updateTeriyaki(-1)} className="w-4 h-4 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[8px] font-bold cursor-pointer"><i className="fa-solid fa-minus"></i></button>
                                <span className="text-[10px] font-bold w-3 text-center">{teriyakiCount}</span>
                                <button onClick={() => updateTeriyaki(1)} className="w-4 h-4 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-[8px] font-bold cursor-pointer"><i className="fa-solid fa-plus"></i></button>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="flex items-center gap-2 pt-0.5">
                        <div className="flex items-center rounded-full border px-2 py-0.5 bg-black/30 border-white/25">
                          <button onClick={decreaseQty} className="w-5 h-5 flex items-center justify-center font-bold text-xs cursor-pointer"><i className="fa-solid fa-minus text-[8px]"></i></button>
                          <span className="w-5 text-center font-bold text-xs">{quantity}</span>
                          <button onClick={increaseQty} className="w-5 h-5 flex items-center justify-center font-bold text-xs cursor-pointer"><i className="fa-solid fa-plus text-[8px]"></i></button>
                        </div>
                        <button 
                          onClick={addToCart}
                          disabled={isSausageAllowed && soyaCount + teriyakiCount !== quantity}
                          className={`font-semibold px-4 py-1.5 rounded-full flex items-center gap-2 transition shadow-xl text-xs cursor-pointer border ${isSausageAllowed && soyaCount + teriyakiCount !== quantity ? 'opacity-50 bg-stone-800 text-white/50 border-white/10' : 'bg-stone-950 text-white border-white/20 hover:bg-black'}`}
                        >
                          Añadir al carrito <span className="w-4 h-4 bg-white text-stone-950 rounded-full flex items-center justify-center text-[8px] font-bold"><i className="fa-solid fa-plus text-[6px]"></i></span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Columna Derecha / Parte Inferior Móvil: Precio Grande y Miniaturas bien arriba */}
                  <div className="lg:col-span-3 flex flex-col justify-end items-center lg:items-end space-y-1 order-3 pb-1 shrink-0">
                    <div className="hidden lg:block text-center lg:text-right space-y-1">
                      <div className="text-5xl font-extrabold tracking-tight">{selectedItem.price}</div>
                    </div>

                    <div className={`flex lg:hidden text-2xl sm:text-3xl font-black text-white drop-shadow-md mt-1 mb-0.5 transition-all ${animating ? 'opacity-0' : 'opacity-100'}`}>
                      {selectedItem.price}
                    </div>

                    <div className="space-y-0.5 w-full flex flex-col items-center lg:items-end">
                      <div className="flex gap-1.5 sm:gap-3 justify-center lg:justify-end flex-wrap max-w-xs">
                        {categoriesData[activeCategory].items.map((item) => (
                          <button
                            key={item.id}
                            onClick={() => handleItemChange(item)}
                            className={`w-9 h-11 sm:w-14 sm:h-16 rounded-xl overflow-hidden border-2 transition-all duration-300 relative cursor-pointer bg-black/30 shadow-md ${selectedItem.id === item.id ? 'border-white ring-2 ring-white/50 scale-105 shadow-xl' : 'border-white/30 opacity-70 hover:opacity-100'}`}
                          >
                            <img src={item.image} alt={item.title} className="w-full h-full object-cover" onError={(e)=>{ e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800"; }} />
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                </div>
              </main>

              {/* Modal Carrito */}
              {cartOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
                  <div className={`bg-gradient-to-br ${selectedItem.bgGradient} ${isLight ? 'text-stone-950' : 'text-white'} rounded-3xl max-w-md lg:max-w-6xl w-full p-5 lg:p-10 shadow-2xl border border-white/20 relative max-h-[92vh] overflow-y-auto no-scrollbar`}>
                    <button type="button" onClick={() => setCartOpen(false)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition cursor-pointer z-20 font-bold">
                      <i className="fa-solid fa-xmark text-xs"></i>
                    </button>

                    <h3 className="text-xl lg:text-2xl font-extrabold mb-4 pr-12">Resumen de tu Pedido</h3>

                    {orderSuccess ? (
                      <div className="py-16 text-center space-y-3">
                        <div className="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold"><i className="fa-solid fa-check"></i></div>
                        <h4 className="text-lg font-bold">¡Redirigiendo a WhatsApp!</h4>
                      </div>
                    ) : cart.length === 0 ? (
                      <div className="py-16 text-center opacity-70 text-sm space-y-2"><i className="fa-solid fa-bag-shopping text-4xl opacity-40 block mb-2"></i>Tu bolsa está vacía.</div>
                    ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <div className="lg:col-span-5 flex flex-col space-y-3">
                          <div className="flex items-center justify-between border-b pb-2 border-white/15">
                            <span className="text-xs uppercase tracking-wider font-bold opacity-90">Productos</span>
                            <button onClick={clearCart} className="text-xs font-bold text-red-400 hover:text-red-300 transition flex items-center gap-1.5 cursor-pointer"><i className="fa-solid fa-trash-can"></i> Vaciar</button>
                          </div>
                          <div className="space-y-2.5 max-h-48 lg:max-h-80 overflow-y-auto no-scrollbar pr-1">
                            {cart.map((item) => (
                              <div key={item.cartItemId} className="flex items-center justify-between bg-black/40 border border-white/10 backdrop-blur-md p-2.5 rounded-2xl gap-2">
                                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                  <img src={item.image} alt={item.title} className="w-10 h-10 object-cover rounded-xl shrink-0" />
                                  <div className="min-w-0 flex-1"><h4 className="font-bold text-xs truncate">{item.displayTitle}</h4><p className="text-[10px] text-orange-400 font-bold">{item.price} c/u</p></div>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                  <div className="flex items-center bg-stone-900 border border-white/20 rounded-lg px-1.5 py-0.5">
                                    <button onClick={() => updateCartItemQty(item.cartItemId, -1)} className="px-1 text-xs font-bold cursor-pointer"><i className="fa-solid fa-minus text-[7px]"></i></button>
                                    <span className="w-5 text-center text-xs font-bold">{item.quantity}</span>
                                    <button onClick={() => updateCartItemQty(item.cartItemId, 1)} className="px-1 text-xs font-bold cursor-pointer"><i className="fa-solid fa-plus text-[7px]"></i></button>
                                  </div>
                                  <span className="font-bold text-xs w-12 text-right">${(item.rawPrice * item.quantity).toLocaleString('es-CL')}</span>
                                  <button onClick={() => removeCartItem(item.cartItemId)} className="w-6 h-6 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition cursor-pointer text-xs"><i className="fa-solid fa-trash-can text-[9px]"></i></button>
                                </div>
                              </div>
                            ))}
                          </div>
                          <div className="flex justify-between items-center pt-3 border-t border-white/20 font-bold text-sm">
                            <span>Total:</span>
                            <span className="text-orange-400 text-lg">${cart.reduce((acc, item) => acc + (item.rawPrice * item.quantity), 0).toLocaleString('es-CL')}</span>
                          </div>
                        </div>

                        <div className="lg:col-span-7 flex flex-col space-y-3">
                          <form onSubmit={handleCheckoutSubmit} className="space-y-3">
                            <h4 className="text-xs font-bold uppercase tracking-wider opacity-90">Datos de Entrega (Santiago)</h4>
                            <input type="text" placeholder="Nombre y Apellido *" required value={formData.fullName} onChange={(e) => setFormData({...formData, fullName: e.target.value})} className="w-full bg-black/40 border border-white/20 text-white placeholder-white/50 backdrop-blur-md rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-orange-500" />
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              <input type="text" placeholder="Dirección exacta *" required value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} className="w-full bg-black/40 border border-white/20 text-white placeholder-white/50 backdrop-blur-md rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-orange-500" />
                              <div className="relative" ref={comunaRef}>
                                <div onClick={() => setComunaDropdownOpen(!comunaDropdownOpen)} className="w-full bg-black/40 border border-white/20 text-white backdrop-blur-md rounded-xl px-3.5 py-2.5 text-xs flex items-center justify-between cursor-pointer">
                                  <span className="truncate">{formData.comuna}</span><i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>
                                {comunaDropdownOpen && (
                                  <div className="absolute left-0 right-0 mt-2 bg-stone-900 text-white border border-white/10 rounded-2xl shadow-2xl z-50 p-3">
                                    <input type="text" placeholder="Buscar comuna..." value={comunaSearch} onChange={(e) => setComunaSearch(e.target.value)} autoFocus className="bg-stone-800 border border-white/10 px-3 py-1.5 rounded-xl text-xs w-full mb-2 outline-none" />
                                    <div className="max-h-40 overflow-y-auto space-y-1">
                                      {filteredComunas.map((c) => (
                                        <div key={c} onClick={() => { setFormData({...formData, comuna: c}); setComunaDropdownOpen(false); setComunaSearch(''); }} className={`px-3 py-2 rounded-xl text-xs cursor-pointer ${formData.comuna === c ? 'bg-orange-500 font-bold' : 'hover:bg-white/10'}`}>{c}</div>
                                      ))}
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              <input type="tel" placeholder="Teléfono (+56 9...) *" required value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full bg-black/40 border border-white/20 text-white placeholder-white/50 backdrop-blur-md rounded-xl px-3.5 py-2.5 text-xs outline-none focus:border-orange-500" />
                              <div className="relative" ref={paymentRef}>
                                <div onClick={() => setPaymentDropdownOpen(!paymentDropdownOpen)} className="w-full bg-black/40 border border-white/20 text-white backdrop-blur-md rounded-xl px-3.5 py-2.5 text-xs flex items-center justify-between cursor-pointer">
                                  <span className="truncate">Pago: {formData.paymentMethod}</span><i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>
                                {paymentDropdownOpen && (
                                  <div className="absolute left-0 right-0 mt-2 bg-stone-900 text-white border border-white/10 rounded-2xl shadow-2xl z-50 p-2 space-y-1">
                                    {METODOS_PAGO.map((m) => (
                                      <div key={m} onClick={() => { setFormData({...formData, paymentMethod: m}); setPaymentDropdownOpen(false); }} className={`px-3 py-2 rounded-xl text-xs cursor-pointer ${formData.paymentMethod === m ? 'bg-orange-500 font-bold' : 'hover:bg-white/10'}`}>{m}</div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>
                            <button type="submit" className="w-full bg-stone-950 hover:bg-black text-white border border-white/20 font-bold py-3.5 rounded-2xl transition shadow-xl text-xs uppercase tracking-wider cursor-pointer mt-2 flex items-center justify-center gap-2.5">
                              <i className="fa-brands fa-whatsapp text-base text-emerald-400"></i> Enviar Pedido por WhatsApp
                            </button>
                          </form>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>
          );
        }

        ReactDOM.render(<HofuLanding />, document.getElementById('root'));
    </script>
</body>
</html>
