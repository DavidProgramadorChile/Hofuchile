    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .native-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Glassmorphism Avanzado con Sombreado Tridimensional Profundo */
        .advanced-glass {
            background: rgba(20, 20, 20, 0.55);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .advanced-glass-light {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        
        @keyframes islandMorph {
            0% { transform: translateY(-30px) scale(0.85); opacity: 0; filter: blur(4px); }
            60% { transform: translateY(4px) scale(1.02); opacity: 1; filter: blur(0); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes islandDismiss {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.9); opacity: 0; filter: blur(2px); }
        }
        .dynamic-island-enter {
            animation: islandMorph 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .dynamic-island-exit {
            animation: islandDismiss 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .dynamic-island-wrapper {
            top: 0.5rem;
        }

        @keyframes borderBeamSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dynamic-island-border-beam {
            position: relative;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .dynamic-island-border-beam::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 270deg, var(--island-glow-color, rgba(255,255,255,0.9)) 330deg, transparent 360deg);
            animation: borderBeamSpin 3s linear infinite;
            pointer-events: none;
        }
        .dynamic-island-border-beam::after {
            content: '';
            position: absolute;
            inset: 1px;
            background: rgba(10, 10, 10, 0.95);
            border-radius: 9999px;
            pointer-events: none;
        }

        .dynamic-island-content {
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: 0.375rem;
            padding-bottom: 0.375rem;
            font-size: 0.7rem;
        }
        @keyframes circularLoaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .cart-loader-ring {
            position: absolute;
            inset: -5px;
            border-radius: 9999px;
            border: 3px dotted rgba(15, 23, 42, 0.85);
            animation: circularLoaderSpin 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.4));
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .badge-bounce {
            animation: badgePop 0.3s ease-in-out;
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(3px); opacity: 1; }
        }
        .scroll-hint-bounce {
            animation: bounceArrow 1.5s ease-in-out infinite;
        }

        .onigiri-custom-vignette {
            background-color: #AACC00;
            background-image: linear-gradient(to bottom right, #AACC00 35%, #768f00 65%, #0c0a09 100%);
        }

        .onigiri-deep-shadow {
            filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.35)) drop-shadow(0 10px 20px rgba(0, 0, 0, 0.25));
        }

        .categories-scroll::-webkit-scrollbar {
            height: 2px;
            display: block;
        }
        .categories-scroll {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s ease;
        }
        .categories-scroll.is-scrolling::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
        .categories-scroll.is-scrolling {
            scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

          const [activeCategory, setActiveCategory] = useState('favoritos');

          const [selectedFlavor, setSelectedFlavor] = useState('Coca-Cola');

          const [quantity, setQuantity] = useState(1);
          const [specialNotes, setSpecialNotes] = useState('');

          const [isImageZoomed, setIsImageZoomed] = useState(false);

          const [soyaCount, setSoyaCount] = useState(1);
          const [teriyakiCount, setTeriyakiCount] = useState(0);
          const [wasabiCount, setWasabiCount] = useState(0);
          const [jengibreCount, setJengibreCount] = useState(0);

          const [searchOpen, setSearchOpen] = useState(false);
          const [searchQuery, setSearchQuery] = useState('');
          const [cartOpen, setCartOpen] = useState(false);

          const [cart, setCart] = useState([]);

          const [orderSuccess, setOrderSuccess] = useState(false);
          const [badgePulsing, setBadgePulsing] = useState(false);
          const [loaderActive, setLoaderActive] = useState(false);

          const [dynamicIsland, setDynamicIsland] = useState({ show: false, leaving: false, message: '¡Añadido con éxito! 🍣', icon: 'fa-solid fa-check' });

          const [isOpen, setIsOpen] = useState(true);

          const [welcomeNotification, setWelcomeNotification] = useState({ show: false, leaving: false, message: '' });

          useEffect(() => {
            const checkStoreStatus = () => {
              const now = new Date();
              const hours = now.getHours();
              const minutes = now.getMinutes();
              const currentTimeMinutes = hours * 60 + minutes;
              const openTimeMinutes = 12 * 60; 
              const closeTimeMinutes = 23 * 60 + 30; 
              const currentlyOpen = currentTimeMinutes >= openTimeMinutes && currentTimeMinutes < closeTimeMinutes;
              setIsOpen(currentlyOpen);
            };

            checkStoreStatus();
            const interval = setInterval(checkStoreStatus, 60000);

            const currentHour = new Date().getHours();
            let greetingText = "";
            if (currentHour >= 6 && currentHour < 12) {
              greetingText = "¡Buenos días! ☀️ ¿Qué vas a pedir hoy en HŌFU?";
            } else if (currentHour >= 12 && currentHour < 19) {
              greetingText = "¡Buenas tardes! 🍣 Disfruta tu almuerzo o tarde HŌFU";
            } else {
              greetingText = "¡Buenas noches! 🌙 Disfruta tu cena HŌFU";
            }

            setWelcomeNotification({ show: true, leaving: false, message: greetingText });

            const timer = setTimeout(() => {
              setWelcomeNotification(prev => ({ ...prev, leaving: true }));
              setTimeout(() => {
                setWelcomeNotification({ show: false, leaving: false, message: '' });
              }, 350);
            }, 5000);

            return () => {
              clearInterval(interval);
              clearTimeout(timer);
            };
          }, []);

          const dismissWelcomeNotification = () => {
            setWelcomeNotification(prev => ({ ...prev, leaving: true }));
            setTimeout(() => {
              setWelcomeNotification({ show: false, leaving: false, message: '' });
            }, 350);
          };

          const [formData, setFormData] = useState({ 
            fullName: '', 
            address: '', 
            comuna: 'Santiago', 
            phone: '',
            paymentMethod: 'Efectivo'
          });

          const [comunaDropdownOpen, setComunaDropdownOpen] = useState(false);
          const [comunaSearch, setComunaSearch] = useState('');
          const [paymentDropdownOpen, setPaymentDropdownOpen] = useState(false);

          const comunaRef = useRef(null);
          const paymentRef = useRef(null);
          const searchContainerRef = useRef(null);
          
          const mobileCategoriesRef = useRef(null);
          const isUserInteractingRef = useRef(false);
          const scrollDirectionRef = useRef(1);

          const [isScrollingCategories, setIsScrollingCategories] = useState(false);
          const scrollTimeoutRef = useRef(null);

          const handleCategoriesScroll = () => {
            setIsScrollingCategories(true);
            if (scrollTimeoutRef.current) {
              clearTimeout(scrollTimeoutRef.current);
            }
            scrollTimeoutRef.current = setTimeout(() => {
              setIsScrollingCategories(false);
            }, 600);
          };

          const allowCustomizations = activeCategory !== 'bebidas' && activeCategory !== 'extras';
          const showWasabiJengibre = activeCategory === 'rolls' || activeCategory === 'tempurarolls';
          
          const isExtra = activeCategory === 'extras';
          const isGohan = activeCategory === 'gohan';

          useEffect(() => {
            const container = mobileCategoriesRef.current;
            if (!container) return;
            let animationFrameId;

            const autoScroll = () => {
              if (!isUserInteractingRef.current && container) {
                const maxScrollLeft = container.scrollWidth - container.clientWidth;
                if (maxScrollLeft > 0) {
                  container.scrollLeft += 0.4 * scrollDirectionRef.current;
                  if (container.scrollLeft >= maxScrollLeft - 1) {
                    scrollDirectionRef.current = -1;
                  } else if (container.scrollLeft <= 1) {
                    scrollDirectionRef.current = 1;
                  }
                }
              }
              animationFrameId = requestAnimationFrame(autoScroll);
            };

            const timer = setTimeout(() => {
              animationFrameId = requestAnimationFrame(autoScroll);
            }, 1500);

            return () => {
              clearTimeout(timer);
              cancelAnimationFrame(animationFrameId);
            };
          }, []);

          useEffect(() => {
            setSoyaCount(quantity);
            setTeriyakiCount(0);
          }, [quantity]);

          useEffect(() => {
            function handleClickOutside(event) {
              if (comunaRef.current && !comunaRef.current.contains(event.target)) {
                setComunaDropdownOpen(false);
              }
              if (paymentRef.current && !paymentRef.current.contains(event.target)) {
                setPaymentDropdownOpen(false);
              }
              if (searchContainerRef.current && !searchContainerRef.current.contains(event.target)) {
                setSearchOpen(false);
              }
            }
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
          }, []);

          const handleCategoryChange = (categoryKey) => {
            if (categoryKey === activeCategory) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setActiveCategory(categoryKey);
            const firstItem = categoriesData[categoryKey].items[0];

            setSelectedEnvoltura('Palta');

            setSoyaCount(1);
            setTeriyakiCount(0);
            setWasabiCount(0);
            setJengibreCount(0);
            setSpecialNotes('');
            setTimeout(() => setAnimating(false), 350);

          const handleItemChange = (item) => {
            if (item.id === selectedItem.id) return;
            setAnimating(true);
            setIsImageZoomed(false);
            setSelectedItem(item);
            setSelectedFlavor('Coca-Cola');
            if (item.hasProteinSelector && item.proteinas) {

                      {selectedItem.price}
                    </div>

                    <div className="space-y-1 w-full flex flex-col items-center lg:items-end pb-1 sm:pb-2 lg:pb-0">
                      <div className="flex gap-2 sm:gap-3 justify-center lg:justify-end flex-wrap max-w-xs lg:max-w-sm">
                        {categoriesData[activeCategory].items.map((item) => (
                          <button
                            key={item.id}
                            onClick={() => handleItemChange(item)}
                            className={`w-11 h-13 sm:w-14 sm:h-16 lg:w-20 lg:h-24 rounded-2xl overflow-hidden border-2 transition-all duration-300 relative cursor-pointer active:scale-95 ${glassClass} shadow-xl flex items-center justify-center p-1 lg:p-2 ${
                              selectedItem.id === item.id
                                ? `${isLight ? 'border-stone-950 ring-2 ring-stone-950/40' : 'border-white ring-2 ring-white/50'} scale-110 shadow-2xl`
                                : `${isLight ? 'border-stone-900/30 opacity-70 hover:opacity-100' : 'border-white/30 opacity-70 hover:opacity-100'}`
                            }`}
                          >
                            <img 
                              src={item.image} 
                              alt={item.title} 
                              className="w-full h-full object-cover rounded-xl"
                              onError={(e)=>{
                                e.target.src = "https://images.unsplash.com/photo-1544441893-675973e31985?auto=format&fit=crop&q=80&w=800";
                              }}
                            />
                          </button>
                        ))}
                      </div>
                    </div>

                  </div>

                </div>
              </main>

              {cartOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
                  
                  <div className={`advanced-glass ${isLight ? 'text-stone-950' : 'text-white'} rounded-3xl max-w-4xl lg:max-w-6xl w-full p-6 lg:p-12 shadow-2xl shadow-black/50 border border-white/20 relative animate-in fade-in zoom-in duration-200 my-auto`}>
                    
                    <button 
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setCartOpen(false);
                      }}
                      className={`absolute top-6 right-6 w-9 h-9 rounded-full ${isLight ? 'bg-black/10 hover:bg-black/20 text-stone-950' : 'bg-white/10 hover:bg-white/20 text-white'} flex items-center justify-center transition active:scale-90 cursor-pointer z-20 font-bold text-sm shadow-lg`}
                    >
                      <i className="fa-solid fa-xmark text-xs"></i>
                    </button>

                    <h3 className="text-2xl lg:text-3xl font-extrabold mb-6 tracking-wide drop-shadow-sm pr-12">Resumen de tu Pedido</h3>

                    {!isOpen && (
                      <div className={`mb-6 p-3.5 rounded-2xl text-xs lg:text-sm flex items-center gap-3 shadow-xl shadow-black/30 ${dynamicClosedBannerBg} ${dynamicClosedBannerText}`}>
                        <i className={`fa-solid fa-clock text-base ${isBackgroundLuminous ? 'text-stone-950' : 'text-white'}`}></i>
                        <span className={`font-semibold ${isBackgroundLuminous ? 'text-stone-950' : 'text-white'}`}>El local se encuentra cerrado en este momento. Tu pedido se enviará programado para la próxima apertura (12:00 PM).</span>
                      </div>
                    )}

                    {orderSuccess ? (
                      <div className="py-20 text-center space-y-4">
                        <div className="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl font-bold shadow-xl">
                          <i className="fa-solid fa-check text-2xl"></i>
                        </div>
                        <h4 className="text-xl font-bold">¡Redirigiendo a WhatsApp!</h4>
                        <p className="text-sm opacity-80">Se abrió tu chat con el pedido detallado. ¡Gracias por elegir HŌFU!</p>
                      </div>
                    ) : cart.length === 0 ? (
                      <div className="py-20 text-center opacity-70 text-base space-y-3">
                        <i className="fa-solid fa-bag-shopping text-5xl opacity-40 block mb-2"></i>
                        Tu bolsa de compras está vacía. ¡Añade tus platos favoritos!
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 items-start">
                        
                        <div className="lg:col-span-6 flex flex-col space-y-4">
                          <div className="flex items-center justify-between border-b pb-3 border-white/15">
                            <span className="text-xs uppercase tracking-wider font-bold opacity-95">Productos en tu bolsa</span>
                            <button 
                              onClick={clearCart}
                              className={`text-xs font-bold px-3 py-1.5 rounded-full transition flex items-center gap-1.5 cursor-pointer active:scale-95 shadow-lg backdrop-blur-xl ${isBackgroundLuminous ? 'bg-black/20 text-stone-950 hover:bg-black/30' : 'bg-white/20 text-white hover:bg-white/30'}`}
                            >
                              <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${isBackgroundLuminous ? 'bg-black/20 text-stone-950' : 'bg-white/20 text-white'}`}>
                                <i className="fa-solid fa-trash-can"></i>
                              </span>
                              Vaciar carrito
                            </button>
                          </div>

                          <div className="space-y-3.5 max-h-72 lg:max-h-96 overflow-y-auto no-scrollbar pr-1">
                            {cart.map((item) => (
                              <div key={item.cartItemId} className={`flex flex-col sm:flex-row sm:items-center justify-between ${isLight ? 'bg-white/30 border-stone-900/15' : 'bg-black/30 border-white/15'} backdrop-blur-2xl p-4 rounded-3xl border gap-3.5 shadow-xl shadow-black/25`}>
                                <div className="flex items-start sm:items-center gap-3.5 min-w-0 flex-1">
                                  <img src={item.image} alt={item.title} className="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-2xl shrink-0 shadow-md" />
                                  <div className="min-w-0 flex-1 flex flex-col justify-center">
                                    <h4 className="font-bold text-xs sm:text-sm leading-snug whitespace-normal break-words">{item.cleanTitle}</h4>
                                    
                                    {item.extrasText && (
                                      <span className={`text-[11px] font-medium opacity-90 mt-0.5 whitespace-normal break-words ${isBackgroundLuminous ? 'text-stone-950 font-semibold' : 'text-white/90'}`}>
                                        {item.extrasText}
                                      </span>
                                    )}

                                    {item.notesText && (
                                      <span className={`text-[10px] italic opacity-80 mt-0.5 whitespace-normal break-words ${isBackgroundLuminous ? 'text-stone-950' : 'text-white/80'}`}>
                                        {item.notesText}
                                      </span>
                                    )}
                                  </div>
                                </div>
                                <div className="flex items-center justify-between sm:justify-end gap-3.5 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/10">
                                  <div className={`flex items-center ${isLight ? 'bg-white/50 border-stone-900/20' : 'bg-stone-900/80 border-white/20'} border rounded-xl px-2.5 py-1 shadow-md`}>
                                    <button onClick={() => updateCartItemQty(item.cartItemId, -1)} className="px-1.5 text-xs font-bold cursor-pointer active:scale-90">
                                      <i className="fa-solid fa-minus text-[8px]"></i>
                                    </button>
                                    <span className="w-6 text-center text-xs font-bold">{item.quantity}</span>
                                    <button onClick={() => updateCartItemQty(item.cartItemId, 1)} className="px-1.5 text-xs font-bold cursor-pointer active:scale-90">
                                      <i className="fa-solid fa-plus text-[8px]"></i>
                                    </button>
                                  </div>
                                  <span className="font-bold text-xs sm:text-sm w-20 text-right">${(item.rawPrice * item.quantity).toLocaleString('es-CL')}</span>
                                  <button 
                                    onClick={() => removeCartItem(item.cartItemId)}
                                    className={`w-7 h-7 rounded-full flex items-center justify-center transition cursor-pointer text-xs active:scale-90 shadow-md ${dynamicIconContainerBg}`}
                                    title="Eliminar producto"
                                  >
                                    <i className="fa-solid fa-trash-can text-[10px]"></i>
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>

                          <div className={`flex justify-between items-center pt-4 border-t ${isLight ? 'border-stone-900/20' : 'border-white/20'} font-bold text-base lg:text-xl`}>
                            <span>Total a pagar:</span>
                            <span className={`text-xl lg:text-2xl ${dynamicPriceColor}`}>
                              ${totalCartAmount.toLocaleString('es-CL')}
                            </span>
                          </div>
                        </div>

                        <div className="lg:col-span-6 flex flex-col space-y-4">
                          <form onSubmit={handleCheckoutSubmit} className="space-y-4">
                            <h4 className="text-xs font-bold uppercase tracking-wider opacity-90">Datos de Entrega & Pago (Santiago)</h4>
                            
                            <input 
                              type="text" 
                              placeholder="Nombre y Apellido *" 
                              required
                              value={formData.fullName}
                              onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                              className={`w-full ${isLight ? 'bg-white/30 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/30 border-white/20 text-white placeholder-white/50'} backdrop-blur-2xl border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-white/50 transition shadow-xl`}
                            />

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <input 
                                type="text" 
                                placeholder="Dirección exacta (Calle, N° de depto/casa) *" 
                                required
                                value={formData.address}
                                onChange={(e) => setFormData({...formData, address: e.target.value})}
                                className={`w-full ${isLight ? 'bg-white/30 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/30 border-white/20 text-white placeholder-white/50'} backdrop-blur-2xl border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-white/50 transition shadow-xl`}
                              />

                              <div className="relative" ref={comunaRef}>
                                <div 
                                  onClick={() => setComunaDropdownOpen(!comunaDropdownOpen)}
                                  className={`w-full ${isLight ? 'bg-white/30 border-stone-900/20 text-stone-950' : 'bg-black/30 border-white/20 text-white'} backdrop-blur-2xl border rounded-2xl px-4 py-3 text-xs lg:text-sm flex items-center justify-between cursor-pointer transition select-none shadow-xl`}
                                >
                                  <span className="truncate">{formData.comuna}</span>
                                  <i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>

                                {comunaDropdownOpen && (
                                  <div className={`absolute left-0 right-0 mt-2 ${isLight ? 'bg-white/95 text-stone-950 border-stone-300' : 'bg-stone-900/95 text-white border-white/15'} backdrop-blur-3xl rounded-2xl shadow-2xl border z-50 p-3`}>
                                    <div className={`flex items-center gap-2 ${isLight ? 'bg-stone-100/70 border-stone-200 text-stone-900' : 'bg-stone-800/70 border-white/10 text-white'} backdrop-blur-md px-3 py-2 rounded-xl border mb-2`}>
                                      <i className="fa-solid fa-search text-xs opacity-50"></i>
                                      <input 
                                        type="text" 
                                        placeholder="Buscar comuna..."
                                        value={comunaSearch}
                                        onChange={(e) => setComunaSearch(e.target.value)}
                                        autoFocus
                                        className="bg-transparent w-full text-xs lg:text-sm outline-none placeholder-current placeholder-opacity-50"
                                      />
                                    </div>
                                    <div className="max-h-48 overflow-y-auto space-y-1 pr-1 no-scrollbar">
                                      {filteredComunas.length > 0 ? (
                                        filteredComunas.map((comuna) => (
                                          <div 
                                            key={comuna}
                                            onClick={() => {
                                              setFormData({...formData, comuna});
                                              setComunaDropdownOpen(false);
                                              setComunaSearch('');
                                            }}
                                            className={`px-3.5 py-2 rounded-xl text-xs lg:text-sm cursor-pointer transition active:scale-98 ${
                                              formData.comuna === comuna 
                                                ? 'bg-stone-950 text-white font-bold border border-black shadow-md' 
                                                : `${isLight ? 'hover:bg-stone-100/60' : 'hover:bg-white/10'}`
                                            }`}
                                          >
                                            {comuna}
                                          </div>
                                        ))
                                      ) : (
                                        <div className="p-3 text-center text-xs opacity-50">No hay resultados</div>
                                      )}
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <input 
                                type="tel" 
                                placeholder="Teléfono / WhatsApp (+56 9...) *" 
                                required
                                value={formData.phone}
                                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                className={`w-full ${isLight ? 'bg-white/30 border-stone-900/20 text-stone-950 placeholder-stone-900/50' : 'bg-black/30 border-white/20 text-white placeholder-white/50'} backdrop-blur-2xl border rounded-2xl px-4 py-3 text-xs lg:text-sm outline-none focus:border-white/50 transition shadow-xl`}
                              />

                              <div className="relative" ref={paymentRef}>
                                <div 
                                  onClick={() => setPaymentDropdownOpen(!paymentDropdownOpen)}
                                  className={`w-full ${isLight ? 'bg-white/30 border-stone-900/20 text-stone-950' : 'bg-black/30 border-white/20 text-white'} backdrop-blur-2xl border rounded-2xl px-4 py-3 text-xs lg:text-sm flex items-center justify-between cursor-pointer transition select-none shadow-xl`}
                                >
                                  <span className="truncate">Pago: {formData.paymentMethod}</span>
                                  <i className="fa-solid fa-chevron-down text-xs opacity-60"></i>
                                </div>

                                {paymentDropdownOpen && (
                                  <div className={`absolute left-0 right-0 mt-2 ${isLight ? 'bg-white/95 text-stone-950 border-stone-300' : 'bg-stone-900/95 text-white border-white/15'} backdrop-blur-3xl rounded-2xl shadow-2xl border z-50 p-2 space-y-1`}>
                                    {METODOS_PAGO.map((metodo) => (
                                      <div 
                                        key={metodo}
                                        onClick={() => {
                                          setFormData({...formData, paymentMethod: metodo});
                                          setPaymentDropdownOpen(false);
                                        }}
                                        className={`px-3.5 py-2.5 rounded-xl text-xs lg:text-sm cursor-pointer transition active:scale-98 ${
                                          formData.paymentMethod === metodo 
                                            ? 'bg-stone-950 text-white font-bold border border-black shadow-md' 
                                            : `${isLight ? 'hover:bg-stone-100/60' : 'hover:bg-white/10'}`
                                        }`}
                                      >
                                        {metodo}
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <button 
                              type="submit"
                              className="w-full bg-stone-950 hover:bg-black text-white border border-white/25 font-bold py-4 rounded-2xl transition active:scale-95 shadow-2xl text-xs lg:text-sm uppercase tracking-wider cursor-pointer mt-3 flex items-center justify-center gap-3"
                            >
                              <i className="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
                              Enviar Pedido por WhatsApp
                            </button>
                          </form>
                        </div>

                      </div>
                    )}

                  </div>
                </div>
              )}

            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<HofuLanding />);
    </script>
</body>
</html>
